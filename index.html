<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4B168E">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- PROSPECCIÓN INTELIGENTE — APP VERSIÓN 1.1 (13 oct 2026) -->
<title>Prospección Inteligente</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</body>
</html>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: una columna de celular, barra de 5 pestañas abajo, ficha de prospecto a pantalla completa */
:root{
  --bg:#F8F5FB; --surface:#FFFFFF; --ink:#1F1630; --muted:#675C78; --line:#E4DCEE;
  --morado:#4B168E; --morado-suave:#EEE6F8; --dorado:#A0740F; --dorado-suave:#F6EEDB;
  --sobre-morado:#FFFFFF;
  --cal:#A8321C; --cal-bg:#FBE6E1; --tib:#8A6208; --tib-bg:#F6EEDB; --fri:#3F5A78; --fri-bg:#E4ECF4;
  --ok:#1E6B4A;
  --display:"Fraunces",Georgia,serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15101F; --surface:#201831; --ink:#F1ECF8; --muted:#A99FBC; --line:#35294B;
  --morado:#B794F0; --morado-suave:#2C2044; --dorado:#DDB04A; --dorado-suave:#33290F;
  --sobre-morado:#1A1028;
  --cal:#F2937D; --cal-bg:#3A1B15; --tib:#DDB04A; --tib-bg:#33290F; --fri:#9DB9D8; --fri-bg:#1B2838;
  --ok:#6FCFA4; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15101F; --surface:#201831; --ink:#F1ECF8; --muted:#A99FBC; --line:#35294B;
  --morado:#B794F0; --morado-suave:#2C2044; --dorado:#DDB04A; --dorado-suave:#33290F;
  --sobre-morado:#1A1028;
  --cal:#F2937D; --cal-bg:#3A1B15; --tib:#DDB04A; --tib-bg:#33290F; --fri:#9DB9D8; --fri-bg:#1B2838;
  --ok:#6FCFA4; color-scheme:dark }

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--dorado);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.top h1{font-size:1.15rem;color:var(--morado)}
.estado{font-size:.75rem;color:var(--muted);text-align:right}

.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 110px;display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h2{font-size:1.3rem}
.sec>h3{font-size:1.05rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--dorado);font-weight:600}
.nota{color:var(--muted);font-size:.9rem}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:.68rem;color:var(--muted);border-radius:10px;min-width:0}
.tabs button[aria-current="page"]{color:var(--morado);font-weight:600}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.btn{border:1px solid var(--morado);background:var(--morado);color:var(--sobre-morado);border-radius:12px;padding:12px 16px;font-weight:600;min-height:46px}
.btn.sec2{background:transparent;color:var(--morado)}
.btn.suave{background:var(--morado-suave);border-color:transparent;color:var(--morado)}
.btn.peligro{background:transparent;border-color:var(--line);color:var(--cal)}
.btn[disabled]{opacity:.55;cursor:default}
.fila{display:flex;flex-wrap:wrap;gap:8px}
.fila>.btn{flex:1 1 140px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.lista{display:flex;flex-direction:column;gap:8px}
.pro{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.pro b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.pro .sub{grid-column:1;color:var(--muted);font-size:.85rem;min-width:0;overflow-wrap:anywhere}
.pro .pt{grid-row:1 / span 2;grid-column:2}
.pt{font-variant-numeric:tabular-nums;font-weight:600;font-size:.85rem;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pt.cal{background:var(--cal-bg);color:var(--cal)} .pt.tib{background:var(--tib-bg);color:var(--tib)}
.pt.fri{background:var(--fri-bg);color:var(--fri)} .pt.sin{background:var(--morado-suave);color:var(--muted)}
.chip{display:inline-block;font-size:.75rem;border-radius:999px;padding:3px 10px;background:var(--morado-suave);color:var(--morado);font-weight:500}

.avance{height:10px;border-radius:999px;background:var(--morado-suave);overflow:hidden}
.avance i{display:block;height:100%;background:var(--dorado);border-radius:999px}

label.campo{display:flex;flex-direction:column;gap:5px;font-size:.9rem;font-weight:500}
label.campo small{font-weight:400;color:var(--muted)}
input[type=text],input[type=url],input[type=number],input[type=email],input[type=password],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:92px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--morado);flex:none}

.canal{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline}
.canal .n{font-family:var(--display);font-size:1.5rem;color:var(--dorado);grid-row:1 / span 2;font-variant-numeric:tabular-nums}
.busq{display:flex;flex-direction:column;gap:8px}
.busq .txt{font-weight:600;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--morado);font-weight:600;font-size:.9rem;border:1px solid var(--line);border-radius:999px;padding:7px 12px;text-decoration:none}
.hecha{font-size:.8rem;color:var(--ok);font-weight:600}
ul.senales{margin:0;padding-left:18px;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:3px}

.filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filtros button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.85rem;color:var(--muted)}
.filtros button[aria-pressed="true"]{background:var(--morado);border-color:var(--morado);color:var(--sobre-morado);font-weight:600}

.hoja{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hoja .barra{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:1}
.hoja .barra button{background:none;border:0;color:var(--morado);font-weight:600;padding:8px 4px}
.hoja .wrap{padding-block:18px 40px}
.dim{display:flex;flex-direction:column;gap:6px}
.dim .cab{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.95rem}
.escala{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.escala button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 0;font-variant-numeric:tabular-nums}
.escala button[aria-pressed="true"]{background:var(--morado);border-color:var(--morado);color:var(--sobre-morado);font-weight:600}

.barras{display:flex;flex-direction:column;gap:10px}
.barra-f{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.9rem}
.barra-f .avance{grid-column:1 / -1}
.barra-f b{font-variant-numeric:tabular-nums}
.tabla{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500}

.vacio{text-align:left;padding:8px 0;display:flex;flex-direction:column;gap:12px}
.vacio h2{font-size:1.6rem;color:var(--morado)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:20;margin:0 auto;max-width:420px;
  background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:.9rem;text-align:center}
.acceso{max-width:440px;margin:0 auto;padding-inline:16px;padding-block:32px 60px;display:flex;flex-direction:column;gap:18px}
.acceso h2{font-size:1.7rem;color:var(--morado)}
.selector{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--morado-suave);padding:4px;border-radius:12px}
.selector button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:600;color:var(--morado)}
.selector button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.error{color:var(--cal);font-size:.9rem}
.res{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.res .sub{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere;grid-column:1}
.res b{overflow-wrap:anywhere}
.res .acc{grid-row:1 / span 3;grid-column:2}
.res .acc .btn{min-height:38px;padding:8px 12px;font-size:.85rem}
.costo{font-size:.82rem;color:var(--muted)}
</style>
</head>
<body>

<section class="acceso" id="acceso" hidden></section>

<header class="top">
  <h1>Prospección Inteligente</h1>
  <div class="estado" id="estado"></div>
</header>
<main class="wrap" id="view"></main>
<nav class="tabs" id="tabs" aria-label="Secciones"></nav>
<section class="hoja" id="hoja" hidden></section>
<div id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fecha(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hoy(){return fecha(new Date())}
function enDias(n){var d=new Date();d.setDate(d.getDate()+n);return fecha(d)}
function clon(o){return JSON.parse(JSON.stringify(o))}
function nuevoId(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

var CANALES={whatsapp:'WhatsApp',instagram:'Instagram',linkedin:'LinkedIn',facebook:'Facebook',google:'Google',otro:'Otro'};
var ETAPAS=[['nuevo','Por calificar'],['listo','Por contactar'],['contactada','Contactada'],['conversacion','En conversación'],['propuesta','Propuesta hecha'],['cliente','Cliente'],['descartada','Descartada']];
function nombreEtapa(e){for(var i=0;i<ETAPAS.length;i++)if(ETAPAS[i][0]===e)return ETAPAS[i][1];return e}
var DIMS=[['n','necesidad','Necesidad'],['a','afinidad','Afinidad'],['c','capacidad','Capacidad de compra']];

var S={meta:{perfil:{oferta:'',cliente:'',problema:'',palabras:'',lugar:'',precio:'',baseLista:false},plan:null,hechas:{},metaDiaria:5},
       pros:{},tab:'hoy',filtro:'todos'};
var IA=null, ocupada='', hoja=null, borrarListo=false, pendiente=false;

/* ---------- Conexión (se guarda solo en este dispositivo) ---------- */
var CFG_LS='pi-conexion';
function leerCfg(){try{return JSON.parse(localStorage.getItem(CFG_LS)||'null')}catch(e){return null}}
function guardarCfg(c){try{localStorage.setItem(CFG_LS,JSON.stringify(c))}catch(e){}}
var CFG=leerCfg()||{sbUrl:'',sbKey:'',puente:'https://puente-prospeccion.conyenrione.workers.dev',codigo:''};
var SB=null, UID=null;

/* ---------- Guardado en Supabase ---------- */
var Store={colas:{},relojes:{},error:false,
  cacheKey:function(){return 'pi-cache-'+(UID||'x')},
  leerLocal:function(){try{var r=JSON.parse(localStorage.getItem(this.cacheKey())||'null');if(r){ponMeta(r.meta);S.pros=r.pros||{}}}catch(e){}},
  guardarLocal:function(){try{localStorage.setItem(this.cacheKey(),JSON.stringify({meta:S.meta,pros:S.pros}))}catch(e){}},
  enFila:function(k,fn){var self=this;var p=(this.colas[k]||Promise.resolve()).then(fn).then(function(r){if(r&&r.error)throw r.error;self.ok()}).catch(function(){self.falla()});this.colas[k]=p;return p},
  ok:function(){if(this.error){this.error=false;pintaEstado()}},
  falla:function(){this.error=true;pintaEstado();toast('No se pudo guardar en tu cuenta. Revisa tu conexión a internet.')},
  programar:function(k,fn){var self=this;clearTimeout(this.relojes[k]);this.relojes[k]=setTimeout(function(){delete self.relojes[k];self.enFila(k,fn)},700)},
  meta:function(){this.guardarLocal();this.programar('meta',function(){return SB.from('pi_ajustes').upsert({user_id:UID,data:clon(S.meta),actualizado:new Date().toISOString()})})},
  pro:function(p){this.guardarLocal();var id=p.id;this.programar('p:'+id,function(){var x=S.pros[id];return x?SB.from('pi_prospectos').upsert({id:id,user_id:UID,data:clon(x),actualizado:new Date().toISOString()}):null})},
  borrar:function(id){delete S.pros[id];this.guardarLocal();clearTimeout(this.relojes['p:'+id]);delete this.relojes['p:'+id];this.enFila('p:'+id,function(){return SB.from('pi_prospectos').delete().eq('id',id)})},
  cargar:async function(){
    var a=await SB.from('pi_ajustes').select('data').eq('user_id',UID).maybeSingle();
    if(a.error)throw a.error;
    var p=await SB.from('pi_prospectos').select('id,data').eq('user_id',UID);
    if(p.error)throw p.error;
    S.meta={perfil:{oferta:'',cliente:'',problema:'',palabras:'',lugar:'',precio:'',baseLista:false},plan:null,hechas:{},metaDiaria:5};
    if(a.data&&a.data.data)ponMeta(a.data.data);
    var n={};(p.data||[]).forEach(function(r){var v=r.data||{};v.id=r.id;n[r.id]=normal(v)});S.pros=n;
    this.guardarLocal();
  }
};
function ponMeta(m){if(!m)return;var base=S.meta;S.meta={perfil:Object.assign({},base.perfil,m.perfil||{}),plan:m.plan||null,hechas:m.hechas||{},metaDiaria:Number(m.metaDiaria)||5}}
function pintaEstado(){$('#estado').textContent=Store.error?'Sin guardar: revisa internet':'Guardado en tu cuenta'}

/* ---------- Pantallas de acceso ---------- */
var acceso={modo:'entrar',msg:'',cargando:false};
function mostrarApp(si){$('#acceso').hidden=si;document.querySelector('.top').hidden=!si;$('#view').hidden=!si;$('#tabs').hidden=!si}
function pantallaConexion(){
  mostrarApp(false);
  $('#acceso').innerHTML='<span class="eyebrow">Primera vez en este dispositivo</span><h2>Conectar la app</h2>'+
   '<p class="nota">Estos datos se guardan solo en este dispositivo. Los encuentras en Supabase, en Project Settings → API.</p>'+
   '<label class="campo" for="cf-url">Dirección del proyecto (Project URL)<input type="url" id="cf-url" value="'+esc(CFG.sbUrl)+'" placeholder="https://xxxx.supabase.co"></label>'+
   '<label class="campo" for="cf-key">Clave pública (anon public)<textarea id="cf-key" style="min-height:70px">'+esc(CFG.sbKey)+'</textarea></label>'+
   '<label class="campo" for="cf-puente">Dirección del puente<input type="url" id="cf-puente" value="'+esc(CFG.puente)+'"></label>'+
   '<label class="campo" for="cf-codigo">Código de acceso del puente<input type="text" id="cf-codigo" value="'+esc(CFG.codigo)+'" autocomplete="off"></label>'+
   (acceso.msg?'<p class="error">'+esc(acceso.msg)+'</p>':'')+
   '<div><button class="btn" data-act="cf-guardar">Guardar y continuar</button></div>';
}
function pantallaLogin(){
  mostrarApp(false);
  var crear=acceso.modo==='crear';
  $('#acceso').innerHTML='<span class="eyebrow">Prospección Inteligente</span><h2>'+(crear?'Crear tu cuenta':'Entrar a tu cuenta')+'</h2>'+
   '<div class="selector" role="group" aria-label="Tipo de acceso"><button data-act="ac-modo" data-v="entrar" aria-pressed="'+!crear+'">Ya tengo cuenta</button><button data-act="ac-modo" data-v="crear" aria-pressed="'+crear+'">Soy nueva</button></div>'+
   '<p class="nota">'+(crear?'Crea tu cuenta una sola vez. Después entra siempre con "Ya tengo cuenta".':'Usa el mismo correo y contraseña con que creaste tu cuenta.')+'</p>'+
   '<label class="campo" for="ac-mail">Correo<input type="email" id="ac-mail" autocomplete="email" inputmode="email"></label>'+
   '<label class="campo" for="ac-pass">Contraseña<small>'+(crear?'Mínimo 6 caracteres.':'')+'</small><input type="password" id="ac-pass" autocomplete="'+(crear?'new-password':'current-password')+'"></label>'+
   (acceso.msg?'<p class="error">'+esc(acceso.msg)+'</p>':'')+
   '<div><button class="btn" data-act="ac-enviar"'+(acceso.cargando?' disabled':'')+'>'+(acceso.cargando?'Un momento…':crear?'Crear mi cuenta':'Entrar')+'</button></div>'+
   '<button class="btn sec2" data-act="ac-conexion" style="align-self:flex-start;min-height:0;padding:8px 12px;font-size:.85rem">Cambiar conexión</button>';
}
async function enviarAcceso(){
  var mail=$('#ac-mail').value.trim(),pass=$('#ac-pass').value;
  if(!mail||!pass){acceso.msg='Escribe tu correo y tu contraseña.';pantallaLogin();return}
  acceso.cargando=true;acceso.msg='';pantallaLogin();$('#ac-mail').value=mail;
  try{
    var r=acceso.modo==='crear'?await SB.auth.signUp({email:mail,password:pass}):await SB.auth.signInWithPassword({email:mail,password:pass});
    if(r.error)throw r.error;
    if(acceso.modo==='crear'&&!r.data.session){acceso.cargando=false;acceso.modo='entrar';acceso.msg='Cuenta creada. Revisa tu correo para confirmarla y luego entra con "Ya tengo cuenta".';pantallaLogin();return}
    acceso.cargando=false;await iniciarSesion(r.data.session);
  }catch(e){
    acceso.cargando=false;
    var m=String(e&&e.message||'');
    acceso.msg=/Invalid login/i.test(m)?'Correo o contraseña incorrectos. Si nunca creaste cuenta, elige "Soy nueva".'
      :/already registered/i.test(m)?'Ese correo ya tiene cuenta. Elige "Ya tengo cuenta".'
      :/Password should be/i.test(m)?'La contraseña debe tener al menos 6 caracteres.'
      :/Email not confirmed/i.test(m)?'Falta confirmar tu correo. Revisa tu bandeja de entrada.'
      :'No se pudo entrar: '+m;
    pantallaLogin();
  }
}
async function iniciarSesion(sesion){
  UID=sesion.user.id;
  Store.leerLocal();mostrarApp(true);pintaEstado();render();
  try{await Store.cargar();Store.error=false}catch(e){Store.error=true;toast('No se pudieron cargar tus datos. Revisa tu conexión.')}
  pintaEstado();render();
}
async function arrancar(){
  if(!window.supabase){mostrarApp(false);$('#acceso').innerHTML='<h2>Sin conexión</h2><p class="nota">No se pudo cargar la app. Revisa tu internet y vuelve a abrirla.</p>';return}
  if(!CFG.sbUrl||!CFG.sbKey){pantallaConexion();return}
  try{SB=window.supabase.createClient(CFG.sbUrl,CFG.sbKey)}catch(e){acceso.msg='La dirección o la clave de Supabase no son válidas.';pantallaConexion();return}
  var s=await SB.auth.getSession();
  if(s.data&&s.data.session)await iniciarSesion(s.data.session);else pantallaLogin();
}
async function cerrarSesion(){try{await SB.auth.signOut()}catch(e){}UID=null;S.pros={};acceso.modo='entrar';acceso.msg='';pantallaLogin()}

/* ---------- Búsqueda automática (puente) ---------- */
var BUS={cantidad:10,canal:'',cargando:false,resultados:null,resumen:null,error:''};
function canalesAuto(){return ['instagram','linkedin','google']}
function textosPara(canal){
  var pl=S.meta.plan,p=S.meta.perfil;
  var t=pl?pl.busquedas.filter(function(b){return b.canal===canal}).map(function(b){return b.texto}):[];
  if(!t.length)t=p.palabras.split(/[,;\n]/).map(function(s){return (s.trim()+' '+p.lugar).trim()}).filter(Boolean);
  return t.slice(0,5);
}

    tipo:tipo,canales:canales,busquedas:bus,senales:clon(SENALES_BASE),creado:hoy(),conIA:false};

function limpiaPlan(r){

  var can=Array.isArray(r.canales)?r.canales.slice(0,4).map(function(c){return {canal:ok(String(c.canal||'').toLowerCase()),porque:String(c.porque||'').slice(0,220)}}):[];

  var s=r.senales||{};
  var sen={necesidad:txt(s.necesidad,5),afinidad:txt(s.afinidad,5),capacidad:txt(s.capacidad,5)};
  return {resumen:String(r.resumen||b.resumen).slice(0,260),tipo:r.tipo==='lugares'?'lugares':'personas',
    canales:can.length?can:b.canales,busquedas:bus.length?bus:b.busquedas,
    senales:{necesidad:sen.necesidad.length?sen.necesidad:b.senales.necesidad,afinidad:sen.afinidad.length?sen.afinidad:b.senales.afinidad,capacidad:sen.capacidad.length?sen.capacidad:b.senales.capacidad},

}

function vMedir(){

  if(!L.length)return h+'<p class="nota">Aquí verás qué canal y qué tipo de prospecto te trae conversaciones y clientes. Aparece cuando empieces a contactar.</p>';
  var cal=L.filter(function(x){return x.calificado}).length,con=L.filter(function(x){return x.contactadaEn}),res=con.filter(function(x){return x.respondioEn}),cli=L.filter(function(x){return x.estado==='cliente'}).length;

  h+='<section class="sec"><h3>El camino</h3><div class="panel barras">'+pasos.map(function(s){
    return '<div class="barra-f"><span>'+s[0]+'</span><b>'+s[1]+'</b><div class="avance" aria-hidden="true"><i style="width:'+Math.round(s[1]/L.length*100)+'%"></i></div></div>'}).join('')+
    '<p class="nota">De cada 100 contactadas responden '+(con.length?Math.round(res.length/con.length*100):'—')+'.</p></div></section>';
  function fila(nom,arr){var r=arr.filter(function(x){return x.respondioEn}).length,c=arr.filter(function(x){return x.estado==='cliente'}).length;
    return '<tr><td>'+nom+'</td><td>'+arr.length+'</td><td>'+r+'</td><td>'+pct(r,arr.length)+'</td><td>'+c+'</td></tr>'}
  var cab='<tr><th>%NOM%</th><th>Contactadas</th><th>Respondieron</th><th>%</th><th>Clientes</th></tr>';
  var porCanal=Object.keys(CANALES).map(function(k){return [k,con.filter(function(x){return x.canal===k})]}).filter(function(x){return x[1].length});
  var porTemp=['cal','tib','fri','sin'].map(function(k){return [k,con.filter(function(x){return temp(x)===k})]}).filter(function(x){return x[1].length});
  if(con.length){
    h+='<section class="sec"><h3>Por canal</h3><div class="panel tabla"><table>'+cab.replace('%NOM%','Canal')+porCanal.map(function(x){return fila(CANALES[x[0]],x[1])}).join('')+'</table></div></section>';

  }
  var ideas=[];
  if(con.length<10)ideas.push('Aún es pronto para sacar conclusiones. Con 10 contactadas ya se empieza a ver un patrón (llevas '+con.length+').');
  else{
    var mejor=porCanal.filter(function(x){return x[1].length>=3}).sort(function(a,b){return b[1].filter(function(y){return y.respondioEn}).length/b[1].length-a[1].filter(function(y){return y.respondioEn}).length/a[1].length})[0];
    if(mejor)ideas.push('Tu mejor canal hasta ahora es '+CANALES[mejor[0]]+'. Pon ahí la mayor parte de tu tiempo.');
    var c=con.filter(function(x){return temp(x)==='cal'}),f=con.filter(function(x){return temp(x)==='fri'});
    if(c.length>=3&&f.length>=3){var rc=c.filter(function(x){return x.respondioEn}).length/c.length,rf=f.filter(function(x){return x.respondioEn}).length/f.length;
      ideas.push(rc>rf?'Las de puntaje alto responden más. El puntaje está acertando: prioriza esas.':'Las de puntaje alto no están respondiendo más que las frías. Conviene revisar tus señales en el perfil.')}
    if(res.length/con.length<0.15)ideas.push('Responden pocas. Antes de buscar más gente, prueba otro primer mensaje.');
  }

  return h;
}

function linksPerfil(p){
  var dom={instagram:'instagram.com',linkedin:'linkedin.com',facebook:'facebook.com'}[p.canal],ok=/^https?:\/\//i;
  var perfil=ok.test(p.perfil)?p.perfil:(dom&&ok.test(p.link)&&p.link.indexOf(dom)>-1?p.link:''),L=[];
  if(perfil)L.push(['Abrir su '+CANALES[p.canal],perfil]);
  else if(dom){var q=encodeURIComponent((p.buscar||p.nombre).replace(/[()]/g,' ').replace(/\s+/g,' ').trim());
    if(p.canal==='linkedin')L.push(['Buscarla en LinkedIn','https://www.linkedin.com/search/results/people/?keywords='+q]);
    else if(p.canal==='facebook')L.push(['Buscarla en Facebook','https://www.facebook.com/search/people/?q='+q]);
    else L.push(['Buscar su Instagram','https://www.google.com/search?q='+encodeURIComponent('site:instagram.com ')+q]);}
  if(ok.test(p.link)&&p.link!==perfil)L.push(['Ver dónde la encontré',p.link]);
  return L.length?'<div class="links">'+L.map(function(l){return '<a href="'+esc(l[1])+'" target="_blank" rel="noopener">'+l[0]+'</a>'}).join('')+'</div>':'';
}
function mover(p,a){
  var h=hoy();
  if(a==='enviada'){p.estado='contactada';p.contactadaEn=p.contactadaEn||h;p.ultimoEnvio=h;p.proximoSeg=enDias(3);if(!p.mensaje){var t=$('#fp-mensaje');if(t)p.mensaje=t.value}}
  else if(a==='seguimiento'){p.seguimientos=(p.seguimientos||0)+1;p.ultimoEnvio=h;p.proximoSeg=enDias(4)}
  else if(a==='respondio'){p.estado='conversacion';p.respondioEn=p.respondioEn||h;p.proximoSeg=''}
  else if(a==='propuesta'){p.estado='propuesta'}
  else if(a==='cliente'){p.estado='cliente';p.clienteEn=h;p.respondioEn=p.respondioEn||h;p.contactadaEn=p.contactadaEn||h}
  else if(a==='descartar'){p.estado='descartada';p.proximoSeg=''}
  Store.pro(p);
}

  else if(ds.nf&&hoja&&hoja.d){hoja.d[ds.nf]=t.value}
  else if(ds.pf&&hoja&&hoja.id&&S.pros[hoja.id]){var p=S.pros[hoja.id];
    if(ds.pf==='estado'){p.estado=t.value;if(t.value==='contactada'&&!p.contactadaEn){p.contactadaEn=hoy();p.proximoSeg=enDias(3)}
      if((t.value==='conversacion'||t.value==='propuesta'||t.value==='cliente')&&!p.respondioEn)p.respondioEn=hoy();
      Store.pro(p);pintaHoja()}
    else{p[ds.pf]=t.value;Store.pro(p)}}
});
document.addEventListener('focusout',function(){if(pendiente)setTimeout(refrescar,80)});

arrancar();
})();
</script>
