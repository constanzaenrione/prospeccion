<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4B168E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prospección">

<link rel="icon" type="image/png" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<!-- PROSPECCIÓN INTELIGENTE — APP VERSIÓN 2.1 (16 oct 2026) -->
<title>Prospección Inteligente</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</body>
</html>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: una columna de celular, barra de 5 pestañas abajo, ficha de prospecto a pantalla completa */
:root{
  --bg:#F8F5FB; --surface:#FFFFFF; --ink:#1F1630; --muted:#675C78; --line:#E4DCEE;
  --morado:#4B168E; --morado-suave:#EEE6F8; --dorado:#A0740F; --dorado-suave:#F6EEDB;
  --sobre-morado:#FFFFFF;
  --cal:#A8321C; --cal-bg:#FBE6E1; --tib:#8A6208; --tib-bg:#F6EEDB; --fri:#3F5A78; --fri-bg:#E4ECF4;
  --ok:#1E6B4A;
  --display:"Fraunces",Georgia,serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15101F; --surface:#201831; --ink:#F1ECF8; --muted:#A99FBC; --line:#35294B;
  --morado:#B794F0; --morado-suave:#2C2044; --dorado:#DDB04A; --dorado-suave:#33290F;
  --sobre-morado:#1A1028;
  --cal:#F2937D; --cal-bg:#3A1B15; --tib:#DDB04A; --tib-bg:#33290F; --fri:#9DB9D8; --fri-bg:#1B2838;
  --ok:#6FCFA4; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15101F; --surface:#201831; --ink:#F1ECF8; --muted:#A99FBC; --line:#35294B;
  --morado:#B794F0; --morado-suave:#2C2044; --dorado:#DDB04A; --dorado-suave:#33290F;
  --sobre-morado:#1A1028;
  --cal:#F2937D; --cal-bg:#3A1B15; --tib:#DDB04A; --tib-bg:#33290F; --fri:#9DB9D8; --fri-bg:#1B2838;
  --ok:#6FCFA4; color-scheme:dark }

*{box-sizing:border-box}

[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--dorado);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}

.cabeza{position:sticky;top:0;z-index:6;background:var(--bg);box-shadow:0 1px 0 var(--line)}
.top{background:#4B168E;color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:1.25rem;color:#fff;display:flex;align-items:center;gap:8px;letter-spacing:.01em}
.top h1 svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2}
.top .lema{font-size:.78rem;opacity:.85;margin-top:2px}
.top .estado{color:#fff;opacity:.85}
.estado{font-size:.75rem;color:var(--muted);text-align:right}

.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h2{font-size:1.3rem}
.sec>h3{font-size:1.05rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--dorado);font-weight:600}
.nota{color:var(--muted);font-size:.9rem}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;max-width:560px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 16px;
  font-size:.9rem;font-weight:600;color:var(--morado);white-space:nowrap;min-height:42px}
.tabs button[aria-current="page"]{background:#4B168E;border-color:#4B168E;color:#fff}
@media (min-width:600px){.tabs{flex-wrap:wrap;overflow:visible;max-width:760px;justify-content:center}}

.btn{border:1px solid var(--morado);background:var(--morado);color:var(--sobre-morado);border-radius:12px;padding:12px 16px;font-weight:600;min-height:46px}
.btn.sec2{background:transparent;color:var(--morado)}
.btn.suave{background:var(--morado-suave);border-color:transparent;color:var(--morado)}
.btn.peligro{background:transparent;border-color:var(--line);color:var(--cal)}
.btn[disabled]{opacity:.55;cursor:default}
.fila{display:flex;flex-wrap:wrap;gap:8px}
.fila>.btn{flex:1 1 140px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.lista{display:flex;flex-direction:column;gap:8px}
.pro{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.pro b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.pro .sub{grid-column:1;color:var(--muted);font-size:.85rem;min-width:0;overflow-wrap:anywhere}
.pro .pt{grid-row:1 / span 2;grid-column:2}
.pt{font-variant-numeric:tabular-nums;font-weight:600;font-size:.85rem;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pt.cal{background:var(--cal-bg);color:var(--cal)} .pt.tib{background:var(--tib-bg);color:var(--tib)}
.pt.fri{background:var(--fri-bg);color:var(--fri)} .pt.sin{background:var(--morado-suave);color:var(--muted)}
.opcs{display:flex;flex-wrap:wrap;gap:8px}
.opc{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.88rem;min-height:40px;color:var(--ink,inherit)}
.opc[aria-pressed=true]{background:var(--morado);border-color:var(--morado);color:#fff}
.bloque{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface)}
.bloque h3{margin:0}
.paso-n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--dorado);color:#fff;font-size:.8rem;font-weight:600;margin-right:8px}
.chip{display:inline-block;font-size:.75rem;border-radius:999px;padding:3px 10px;background:var(--morado-suave);color:var(--morado);font-weight:500}

.avance{height:10px;border-radius:999px;background:var(--morado-suave);overflow:hidden}
.avance i{display:block;height:100%;background:var(--dorado);border-radius:999px}

label.campo{display:flex;flex-direction:column;gap:5px;font-size:.9rem;font-weight:500}
label.campo small{font-weight:400;color:var(--muted)}
input[type=text],input[type=url],input[type=number],input[type=email],input[type=password],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:92px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--morado);flex:none}

.canal{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline}
.canal .n{font-family:var(--display);font-size:1.5rem;color:var(--dorado);grid-row:1 / span 2;font-variant-numeric:tabular-nums}
.busq{display:flex;flex-direction:column;gap:8px}
.busq .txt{font-weight:600;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--morado);font-weight:600;font-size:.9rem;border:1px solid var(--line);border-radius:999px;padding:7px 12px;text-decoration:none}
.hecha{font-size:.8rem;color:var(--ok);font-weight:600}
ul.senales{margin:0;padding-left:18px;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:3px}

.filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filtros button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.85rem;color:var(--muted)}
.filtros button[aria-pressed="true"]{background:var(--morado);border-color:var(--morado);color:var(--sobre-morado);font-weight:600}

.hoja{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hoja .barra{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:1}
.hoja .barra button{background:none;border:0;color:var(--morado);font-weight:600;padding:8px 4px}
.hoja .wrap{padding-block:18px 40px}
.dim{display:flex;flex-direction:column;gap:6px}
.dim .cab{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.95rem}
.escala{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.escala button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 0;font-variant-numeric:tabular-nums}
.escala button[aria-pressed="true"]{background:var(--morado);border-color:var(--morado);color:var(--sobre-morado);font-weight:600}

.barras{display:flex;flex-direction:column;gap:10px}
.barra-f{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.9rem}
.barra-f .avance{grid-column:1 / -1}
.barra-f b{font-variant-numeric:tabular-nums}
.tabla{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500}

.vacio{text-align:left;padding:8px 0;display:flex;flex-direction:column;gap:12px}
.vacio h2{font-size:1.6rem;color:var(--morado)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;margin:0 auto;max-width:420px;
  background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:.9rem;text-align:center}
.acceso{max-width:440px;margin:0 auto;padding-inline:16px;padding-block:32px 60px;display:flex;flex-direction:column;gap:18px}
.acceso h2{font-size:1.7rem;color:var(--morado)}
.selector{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--morado-suave);padding:4px;border-radius:12px}
.selector button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:600;color:var(--morado)}
.selector button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.error{color:var(--cal);font-size:.9rem}
.res{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.res .sub{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere;grid-column:1}
.res b{overflow-wrap:anywhere}
.res .acc{grid-row:1 / span 3;grid-column:2}
.res .acc .btn{min-height:38px;padding:8px 12px;font-size:.85rem}
.costo{font-size:.82rem;color:var(--muted)}
</style>
</head>
<body>

<section class="acceso" id="acceso" hidden></section>

<div class="cabeza" id="cabeza">
<header class="top">
  <div><h1><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>Prospección Inteligente</h1><p class="lema">Encuentra · Califica · Conversa</p></div>
  <div class="estado" id="estado"></div>
</header>
<nav class="tabs" id="tabs" aria-label="Secciones"></nav>
</div>
<main class="wrap" id="view"></main>
<section class="hoja" id="hoja" hidden></section>
<div id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fecha(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hoy(){return fecha(new Date())}
function enDias(n){var d=new Date();d.setDate(d.getDate()+n);return fecha(d)}
function clon(o){return JSON.parse(JSON.stringify(o))}
function nuevoId(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

var CANALES={whatsapp:'WhatsApp',instagram:'Instagram',linkedin:'LinkedIn',facebook:'Facebook',google:'Google',otro:'Otro'};
var ETAPAS=[['revisar','Por revisar'],['nuevo','Por calificar'],['listo','Por contactar'],['contactada','Contactada'],['conversacion','En conversación'],['propuesta','Propuesta hecha'],['cliente','Cliente'],['descartada','Descartada']];
function nombreEtapa(e){for(var i=0;i<ETAPAS.length;i++)if(ETAPAS[i][0]===e)return ETAPAS[i][1];return e}
var DIMS=[['n','necesidad','Necesidad'],['a','afinidad','Afinidad'],['c','capacidad','Capacidad de compra']];

var S={meta:{perfil:{oferta:'',cliente:'',problema:'',palabras:'',lugar:'',precio:'',baseLista:false,tipos:[],otrosTipos:'',momento:'',senalesSi:'',noQuiero:[],noQuieroTxt:''},plan:null,hechas:{},metaDiaria:5},
       pros:{},tab:'hoy',filtro:'todos'};
var IA=null, ocupada='', hoja=null, borrarListo=false, pendiente=false;

/* ---------- Conexión (se guarda solo en este dispositivo) ---------- */
var CFG_LS='pi-conexion';
function leerCfg(){try{return JSON.parse(localStorage.getItem(CFG_LS)||'null')}catch(e){return null}}
function guardarCfg(c){try{localStorage.setItem(CFG_LS,JSON.stringify(c))}catch(e){}}
var CFG=leerCfg()||{sbUrl:'',sbKey:'',puente:'https://puente-prospeccion.conyenrione.workers.dev',codigo:''};
var SB=null, UID=null;

/* ---------- Guardado en Supabase ---------- */
var Store={colas:{},relojes:{},error:false,
  cacheKey:function(){return 'pi-cache-'+(UID||'x')},
  leerLocal:function(){try{var r=JSON.parse(localStorage.getItem(this.cacheKey())||'null');if(r){ponMeta(r.meta);S.pros=r.pros||{}}}catch(e){}},
  guardarLocal:function(){try{localStorage.setItem(this.cacheKey(),JSON.stringify({meta:S.meta,pros:S.pros}))}catch(e){}},
  enFila:function(k,fn){var self=this;var p=(this.colas[k]||Promise.resolve()).then(fn).then(function(r){if(r&&r.error)throw r.error;self.ok()}).catch(function(){self.falla()});this.colas[k]=p;return p},
  ok:function(){if(this.error){this.error=false;pintaEstado()}},
  falla:function(){this.error=true;pintaEstado();toast('No se pudo guardar en tu cuenta. Revisa tu conexión a internet.')},
  programar:function(k,fn){var self=this;clearTimeout(this.relojes[k]);this.relojes[k]=setTimeout(function(){delete self.relojes[k];self.enFila(k,fn)},700)},
  meta:function(){this.guardarLocal();this.programar('meta',function(){return SB.from('pi_ajustes').upsert({user_id:UID,data:clon(S.meta),actualizado:new Date().toISOString()})})},
  pro:function(p){this.guardarLocal();var id=p.id;this.programar('p:'+id,function(){var x=S.pros[id];return x?SB.from('pi_prospectos').upsert({id:id,user_id:UID,data:clon(x),actualizado:new Date().toISOString()}):null})},
  borrar:function(id){delete S.pros[id];this.guardarLocal();clearTimeout(this.relojes['p:'+id]);delete this.relojes['p:'+id];this.enFila('p:'+id,function(){return SB.from('pi_prospectos').delete().eq('id',id)})},
  cargar:async function(){
    var a=await SB.from('pi_ajustes').select('data').eq('user_id',UID).maybeSingle();
    if(a.error)throw a.error;
    var p=await SB.from('pi_prospectos').select('id,data').eq('user_id',UID);
    if(p.error)throw p.error;
    S.meta={perfil:{oferta:'',cliente:'',problema:'',palabras:'',lugar:'',precio:'',baseLista:false,tipos:[],otrosTipos:'',momento:'',senalesSi:'',noQuiero:[],noQuieroTxt:''},plan:null,hechas:{},metaDiaria:5};
    if(a.data&&a.data.data)ponMeta(a.data.data);
    var n={};(p.data||[]).forEach(function(r){var v=r.data||{};v.id=r.id;n[r.id]=normal(v)});S.pros=n;
    this.guardarLocal();
  }
};
function ponMeta(m){if(!m)return;var base=S.meta;S.meta={perfil:Object.assign({},base.perfil,m.perfil||{}),plan:m.plan||null,hechas:m.hechas||{},metaDiaria:Number(m.metaDiaria)||5,busquedas:Array.isArray(m.busquedas)?m.busquedas:[],filtros:m.filtros||{},ultima:m.ultima||null}}
function pintaEstado(){$('#estado').textContent=Store.error?'Sin guardar: revisa internet':(EMAIL||'Guardado en tu cuenta')}

/* ---------- Pantallas de acceso ---------- */
var acceso={modo:'entrar',msg:'',cargando:false};
function mostrarApp(si){$('#acceso').hidden=si;$('#cabeza').hidden=!si;$('#view').hidden=!si;$('#tabs').hidden=!si}
function pantallaConexion(){
  mostrarApp(false);
  $('#acceso').innerHTML='<span class="eyebrow">Primera vez en este dispositivo</span><h2>Conectar la app</h2>'+
   '<p class="nota">Estos datos se guardan solo en este dispositivo. Los encuentras en Supabase, en Project Settings → API.</p>'+
   '<label class="campo" for="cf-url">Dirección del proyecto (Project URL)<input type="url" id="cf-url" value="'+esc(CFG.sbUrl)+'" placeholder="https://xxxx.supabase.co"></label>'+
   '<label class="campo" for="cf-key">Clave pública (anon public)<textarea id="cf-key" style="min-height:70px">'+esc(CFG.sbKey)+'</textarea></label>'+
   '<label class="campo" for="cf-puente">Dirección del puente<input type="url" id="cf-puente" value="'+esc(CFG.puente)+'"></label>'+
   '<label class="campo" for="cf-codigo">Código de acceso del puente<input type="text" id="cf-codigo" value="'+esc(CFG.codigo)+'" autocomplete="off"></label>'+
   (acceso.msg?'<p class="error">'+esc(acceso.msg)+'</p>':'')+
   '<div><button class="btn" data-act="cf-guardar">Guardar y continuar</button></div>';
}
function pantallaLogin(){
  mostrarApp(false);
  var crear=acceso.modo==='crear';
  $('#acceso').innerHTML='<span class="eyebrow">Prospección Inteligente</span><h2>'+(crear?'Crear tu cuenta':'Entrar a tu cuenta')+'</h2>'+
   '<div class="selector" role="group" aria-label="Tipo de acceso"><button data-act="ac-modo" data-v="entrar" aria-pressed="'+!crear+'">Ya tengo cuenta</button><button data-act="ac-modo" data-v="crear" aria-pressed="'+crear+'">Soy nueva</button></div>'+
   '<p class="nota">'+(crear?'Crea tu cuenta una sola vez. Después entra siempre con "Ya tengo cuenta".':'Usa el mismo correo y contraseña con que creaste tu cuenta.')+'</p>'+
   '<label class="campo" for="ac-mail">Correo<input type="email" id="ac-mail" autocomplete="email" inputmode="email"></label>'+
   '<label class="campo" for="ac-pass">Contraseña<small>'+(crear?'Mínimo 6 caracteres.':'')+'</small><input type="password" id="ac-pass" autocomplete="'+(crear?'new-password':'current-password')+'"></label>'+
   (acceso.msg?'<p class="error">'+esc(acceso.msg)+'</p>':'')+
   '<div><button class="btn" data-act="ac-enviar"'+(acceso.cargando?' disabled':'')+'>'+(acceso.cargando?'Un momento…':crear?'Crear mi cuenta':'Entrar')+'</button></div>'+
   '<button class="btn sec2" data-act="ac-conexion" style="align-self:flex-start;min-height:0;padding:8px 12px;font-size:.85rem">Cambiar conexión</button>';
}
async function enviarAcceso(){
  var mail=$('#ac-mail').value.trim(),pass=$('#ac-pass').value;
  if(!mail||!pass){acceso.msg='Escribe tu correo y tu contraseña.';pantallaLogin();return}
  acceso.cargando=true;acceso.msg='';pantallaLogin();$('#ac-mail').value=mail;
  try{
    var r=acceso.modo==='crear'?await SB.auth.signUp({email:mail,password:pass}):await SB.auth.signInWithPassword({email:mail,password:pass});
    if(r.error)throw r.error;
    if(acceso.modo==='crear'&&!r.data.session){acceso.cargando=false;acceso.modo='entrar';acceso.msg='Cuenta creada. Revisa tu correo para confirmarla y luego entra con "Ya tengo cuenta".';pantallaLogin();return}
    acceso.cargando=false;await iniciarSesion(r.data.session);
  }catch(e){
    acceso.cargando=false;
    var m=String(e&&e.message||'');
    acceso.msg=/Invalid login/i.test(m)?'Correo o contraseña incorrectos. Si nunca creaste cuenta, elige "Soy nueva".'
      :/already registered/i.test(m)?'Ese correo ya tiene cuenta. Elige "Ya tengo cuenta".'
      :/Password should be/i.test(m)?'La contraseña debe tener al menos 6 caracteres.'
      :/Email not confirmed/i.test(m)?'Falta confirmar tu correo. Revisa tu bandeja de entrada.'
      :'No se pudo entrar: '+m;
    pantallaLogin();
  }
}
var EMAIL='';
async function verificarAcceso(){
  var r=await SB.from('pi_acceso').select('email,activo').eq('email',EMAIL.toLowerCase()).maybeSingle();
  if(r.error)return {ok:false,msg:'No se pudo verificar tu acceso ('+r.error.message+'). Revisa tu internet e inténtalo de nuevo.'};
  if(!r.data||!r.data.activo)return {ok:false,msg:'Tu cuenta ('+EMAIL+') todavía no tiene acceso a esta app. Pídele a tu mentora que te habilite.'};
  return {ok:true};
}
function pantallaSinAcceso(msg){
  mostrarApp(false);
  $('#acceso').innerHTML='<span class="eyebrow">Prospección Inteligente</span><h2>Acceso pendiente</h2><p class="nota">'+esc(msg)+'</p>'+
   '<div class="fila"><button class="btn" data-act="reintentar">Volver a intentar</button><button class="btn sec2" data-act="salir">Entrar con otra cuenta</button></div>';
}
async function iniciarSesion(sesion){
  EMAIL=sesion.user.email||'';
  var acc=await verificarAcceso();
  if(!acc.ok){pantallaSinAcceso(acc.msg);return}
  UID=sesion.user.id;
  Store.leerLocal();mostrarApp(true);pintaEstado();render();
  try{await Store.cargar();Store.error=false;restaurarUltima()}catch(e){Store.error=true;toast('No se pudieron cargar tus datos. Revisa tu conexión.')}
  pintaEstado();render();
}
async function arrancar(){
  if(!window.supabase){mostrarApp(false);$('#acceso').innerHTML='<h2>Sin conexión</h2><p class="nota">No se pudo cargar la app. Revisa tu internet y vuelve a abrirla.</p>';return}
  if(!CFG.sbUrl||!CFG.sbKey){pantallaConexion();return}
  try{SB=window.supabase.createClient(CFG.sbUrl,CFG.sbKey)}catch(e){acceso.msg='La dirección o la clave de Supabase no son válidas.';pantallaConexion();return}
  var s=await SB.auth.getSession();
  if(s.data&&s.data.session)await iniciarSesion(s.data.session);else pantallaLogin();
}
async function cerrarSesion(){try{await SB.auth.signOut()}catch(e){}UID=null;EMAIL='';BUS.resultados=null;BUS.marca={};BUS.reg=null;S.pros={};acceso.modo='entrar';acceso.msg='';pantallaLogin()}

/* ---------- Búsqueda automática (puente) ---------- */
var BUS={cantidad:10,canal:'',cargando:false,resultados:null,resumen:null,error:'',reg:null,marca:{},abierto:-1};
var MOTIVOS=[['proveedor','Vende lo mismo que yo'],['organizacion','Empresa o institución'],['perfil','No es mi cliente ideal'],['otro','Otro motivo']];
function registro(){if(!Array.isArray(S.meta.busquedas))S.meta.busquedas=[];return S.meta.busquedas}
function guardarUltima(){
  if(!BUS.resultados)return;
  S.meta.ultima={canal:BUS.canal,fecha:hoy(),resultados:BUS.resultados,marca:BUS.marca||{},reg:BUS.reg||null,
    resumen:BUS.resumen?{encontrados:BUS.resumen.encontrados||0,descartados:(BUS.resumen.descartados||[]).length}:null};
  Store.meta();
}
function restaurarUltima(){
  var u=S.meta.ultima;if(!u||BUS.resultados||!Array.isArray(u.resultados))return;
  BUS.canal=u.canal||BUS.canal;BUS.resultados=u.resultados;BUS.marca=u.marca||{};BUS.reg=u.reg||null;BUS.fechaRes=u.fecha;
  BUS.resumen=u.resumen?{encontrados:u.resumen.encontrados,descartados:new Array(u.resumen.descartados||0)}:null;

async function recuperarUltima(){
  if(!CFG.puente||!CFG.codigo){toast('Falta configurar el puente. Ve a Perfil → Conexión.');return}
  BUS.recuperando=true;BUS.error='';render();
  try{
    var fi=filtrosDe('instagram');
    var r=await fetch(CFG.puente.replace(/\/$/,'')+'/ultima',{method:'POST',headers:{'content-type':'application/json','x-codigo':CFG.codigo},
      body:JSON.stringify({filtro:{minSeguidores:Number(fi.min)||0,maxSeguidores:Number(fi.max)||5000},excluir:comas(filtrosDe(canalActual()).excluir),perfilCliente:textoPerfilCliente()})});

    if(!r.ok)throw new Error(d.error||('El puente respondió '+r.status));
    if(!d.canal){toast('No encontré búsquedas anteriores en Apify.')}
    else{BUS.canal=d.canal;BUS.resultados=ordenarPorSenales(d.resultados);BUS.resumen=d.resumen||null;BUS.marca={};BUS.reg=null;BUS.fechaRes=String(d.fecha||'').slice(0,10);guardarUltima();
      toast('Recuperé '+BUS.resultados.length+' perfiles de tu última búsqueda, sin costo de búsqueda.')}
  }catch(e){BUS.error=/Failed to fetch|NetworkError|Load failed/i.test(String(e.message))?'Se cortó la conexión. Inténtalo de nuevo.':String(e.message)}

}
function regActual(){var id=BUS.reg;return registro().filter(function(b){return b.id===id})[0]||null}
function canalesAuto(){return ['instagram','linkedin','google']}
function textosPara(canal){
  var fl=lineas(filtrosDe(canal).busquedas);if(fl.length)return fl.slice(0,5);
  var pl=S.meta.plan,p=S.meta.perfil;
  var t=pl?pl.busquedas.filter(function(b){return b.canal===canal}).map(function(b){return b.texto}):[];
  if(!t.length){var L=lugares();t=palabrasCliente().map(function(s,i){return (s+' '+(L.length?L[i%L.length]:'')).trim()})}
  return t.slice(0,5);
}
/* ---------- Filtros de búsqueda: propuesta y validación ---------- */
function norm(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function lineas(t){return String(t||'').split(/\n/).map(function(x){return x.trim()}).filter(Boolean)}
function comas(t){return String(t||'').split(/[,;\n]/).map(function(x){return x.trim()}).filter(Boolean)}
function esB2B(){var p=S.meta.perfil;return /jef|gerent|director|l[ií]der|ejecutiv|supervis|mandos|empresa|rrhh|recursos humanos|corporativ/.test(norm(p.cliente+' '+p.palabras+' '+(p.tipos||[]).join(' ')))}
function proponerFiltros(canal){
  var p=S.meta.perfil,L=lugares(),b2b=esB2B();
  var roles=palabrasCliente();
  if(!roles.length)roles=b2b?['jefe de área','gerente','supervisor','director']:[String(p.cliente||'').split(/[,.]/)[0].trim()].filter(Boolean);
  var bus=roles.slice(0,4).map(function(r,i){var lg=L.length?L[i%L.length]:'';return (r+' '+(L.some(function(x){return norm(r).indexOf(norm(x))>-1})?'':lg)).trim()});
  var pl=S.meta.plan;
  if(pl&&pl.busquedas){var dePlan=pl.busquedas.filter(function(b){return b.canal===canal}).map(function(b){return String(b.texto||'').trim()}).filter(Boolean);
    if(dePlan.length)bus=dePlan.concat(bus).filter(function(x,i,a){return a.map(norm).indexOf(norm(x))===i}).slice(0,5)}
  var base=b2b?['consultor','consultora','coach','capacitación','reclutador','headhunter','estudiante','vacante']
    :['academia','escuela','agencia','tienda','certificación','formación'];
  var deOferta=['coaching','coach','mentoría','mentora','consultoría','capacitación','taller','terapia','asesoría'].filter(function(w){return norm(p.oferta).indexOf(norm(w))>-1});
  var cliente=norm(p.cliente+' '+p.palabras);
  var ex=[];exclusionesFicha().concat(base,deOferta).forEach(function(w){if(cliente.indexOf(norm(w))===-1&&ex.map(norm).indexOf(norm(w))===-1)ex.push(w)});
  var rg=rangoSeguidores();return {busquedas:bus.join('\n'),excluir:ex.slice(0,14).join(', '),min:canal==='instagram'?rg[0]:'',max:canal==='instagram'?rg[1]:''};
}
function filtrosDe(canal){
  if(!S.meta.filtros)S.meta.filtros={};
  if(!S.meta.filtros[canal])S.meta.filtros[canal]=proponerFiltros(canal);
  return S.meta.filtros[canal];
}
function validarBusqueda(canal){
  var f=filtrosDe(canal),p=S.meta.perfil,items=[],pts=100;
  function add(tipo,texto,fix,resta){items.push({tipo:tipo,texto:texto,fix:fix||''});pts-=resta||0}
  var B=lineas(f.busquedas),E=comas(f.excluir),LG=lugares().map(norm),lugar=LG.join(', ');
  if(!B.length){add('alerta','No hay búsquedas escritas. Sin ellas la app no sabe qué buscar.','proponer',100);return {pts:0,items:items}}
  var b2b=esB2B();
  if(b2b&&canal==='instagram')add('mejora','Tu cliente trabaja en empresas: en LinkedIn muestra su cargo y es más fácil de encontrar que en Instagram.','canal-linkedin',20);
  if(!b2b&&canal==='linkedin')add('mejora','Tu cliente suele mostrarse más en Instagram que en LinkedIn.','canal-instagram',10);
  if(B.length>5)add('mejora','Hay '+B.length+' búsquedas y solo se usan las primeras 5.','recortar',5);
  var dup=B.length-B.map(norm).filter(function(x,i,a){return a.indexOf(x)===i}).length;
  if(dup)add('mejora','Hay búsquedas repetidas: gastan sin traer gente nueva.','sin-duplicados',5);
  var comillas=B.filter(function(b){return /["“”]|\bOR\b/.test(b)});
  if(comillas.length)add('mejora','Las comillas y la palabra OR hacen la búsqueda tan exacta que suele traer 0 resultados.','sin-comillas',15);
  var largas=B.filter(function(b){return b.split(/\s+/).length>6});
  if(largas.length)add('mejora',largas.length+' búsqueda(s) con más de 6 palabras: mientras más larga, menos resultados.','acortar',10);
  var cortas=B.filter(function(b){return b.split(/\s+/).length<2});
  if(cortas.length)add('mejora',cortas.length+' búsqueda(s) de una sola palabra: traen cuentas grandes o famosas, no a tu cliente.','agregar-lugar',10);
  if(LG.length){var sinLugar=B.filter(function(b){return !LG.some(function(x){return norm(b).indexOf(x)>-1})});
    if(sinLugar.length)add('mejora',sinLugar.length+' búsqueda(s) sin país o ciudad: puede traer gente de otros países.','agregar-lugar',10)}
  else add('mejora','No indicaste país o ciudad en tu perfil. Agregarlo enfoca mucho la búsqueda.','',5);
  if(!E.length)add('mejora','Sin exclusiones aparecerán proveedores y competencia (quienes venden lo mismo que tú).','exclusiones',15);
  var choque=E.filter(function(e){return B.some(function(b){return norm(b).indexOf(norm(e))>-1})});
  if(choque.length)add('alerta','Excluyes "'+choque.join('", "')+'" pero también lo buscas: se anulan entre sí.','quitar-choques',20);
  if(canal==='instagram'){var mx=Number(f.max)||0;if(mx>10000)add('mejora','Más de 10.000 seguidores suele ser alguien con negocio ya armado.','seguidores',5)}
  var R=registro().filter(function(r){return r.canal===canal}),ag=0,no=0,mot={};
  R.forEach(function(r){ag+=r.agregados;for(var k in r.noCalza){no+=r.noCalza[k];mot[k]=(mot[k]||0)+r.noCalza[k]}});
  if(ag+no>=5&&no/(ag+no)>0.5){var top=Object.keys(mot).sort(function(a,b){return mot[b]-mot[a]})[0];
    add('alerta','En tus búsquedas anteriores en '+CANALES[canal]+' no calzaron '+Math.round(no/(ag+no)*100)+'%. El motivo más común: '+(MOTIVOS.filter(function(m){return m[0]===top})[0]||['',''])[1].toLowerCase()+'.',top==='proveedor'||top==='organizacion'?'exclusiones':'',15)}
  if(BUS.cantidad>=20)add('bien','Pediste 20: cuesta más y tarda más. Con 10 ya puedes medir si la búsqueda sirve.','',0);
  pts=Math.max(0,Math.min(100,pts));
  if(!items.filter(function(i){return i.tipo!=='bien'}).length)items.unshift({tipo:'bien',texto:'Tu búsqueda está bien armada.',fix:''});
  return {pts:pts,items:items};
}
function aplicarMejora(canal,fix){
  var f=filtrosDe(canal),p=S.meta.perfil,B=lineas(f.busquedas),E=comas(f.excluir),LL=lugares(),lugar=LL[0]||'';
  if(fix==='proponer'){S.meta.filtros[canal]=proponerFiltros(canal);return canal}
  if(fix==='canal-linkedin'){filtrosDe('linkedin');return 'linkedin'}
  if(fix==='canal-instagram'){filtrosDe('instagram');return 'instagram'}
  if(fix==='recortar')B=B.slice(0,5);
  if(fix==='sin-duplicados')B=B.filter(function(x,i){return B.map(norm).indexOf(norm(x))===i});
  if(fix==='sin-comillas')B=B.map(function(b){return b.replace(/["“”]/g,'').replace(/\s+OR\s+/g,' ').replace(/\s+/g,' ').trim()});
  if(fix==='acortar')B=B.map(function(b){var w=b.split(/\s+/);if(w.length<=6)return b;var l=lugar&&norm(b).indexOf(norm(lugar))>-1?' '+lugar:'';return w.filter(function(x){return norm(x)!==norm(lugar)}).slice(0,4).join(' ')+l});
  if(fix==='agregar-lugar'&&LL.length)B=B.map(function(b,i){return LL.some(function(x){return norm(b).indexOf(norm(x))>-1})?b:b+' '+LL[i%LL.length]});
  if(fix==='exclusiones'){comas(proponerFiltros(canal).excluir).forEach(function(w){if(E.map(norm).indexOf(norm(w))===-1)E.push(w)})}
  if(fix==='quitar-choques')E=E.filter(function(e){return !B.some(function(b){return norm(b).indexOf(norm(e))>-1})});
  if(fix==='seguidores')f.max=5000;
  f.busquedas=B.join('\n');f.excluir=E.join(', ');return canal;
}
function vValidacion(canal){
  var v=validarBusqueda(canal),c=v.pts>=75?'ok':v.pts>=50?'tib':'cal',et=v.pts>=75?'Buena':v.pts>=50?'Mejorable':'Débil';
  return '<div class="panel" style="border-color:var(--dorado)"><div class="fila" style="justify-content:space-between;align-items:center"><b>Eficiencia estimada</b><span class="pt '+(c==='ok'?'fri':c)+'">'+v.pts+'/100 · '+et+'</span></div>'+
   '<ul class="senales">'+v.items.map(function(i){return '<li>'+(i.tipo==='alerta'?'⚠ ':i.tipo==='bien'?'✓ ':'')+esc(i.texto)+(i.fix?' <button class="btn suave" style="min-height:0;padding:4px 10px;font-size:.8rem" data-act="fil-fix" data-v="'+i.fix+'">Corregir</button>':'')+'</li>'}).join('')+'</ul>'+
   (v.items.some(function(i){return i.fix})?'<div><button class="btn suave" data-act="fil-todas">Aplicar todas las mejoras</button></div>':'')+'</div>';
}

/* ---------- Búsqueda gratis (el usuario busca en Google) ---------- */
function sugerenciasGratis(){
  var c=canalActual(),out=[],p=S.meta.perfil;
  lineas(filtrosDe(c).busquedas).forEach(function(t){out.push(t)});
  (S.meta.plan&&S.meta.plan.busquedas||[]).forEach(function(b){out.push(b.texto)});
  palabrasCliente().forEach(function(w,i){var L=lugares();out.push((w+' '+(L.length?L[i%L.length]:'')).trim())});
  return out.map(function(t){return String(t||'').trim()}).filter(function(t,i,a){return t&&a.map(norm).indexOf(norm(t))===i}).slice(0,8);
}
function urlGratis(){
  var q=String(BUS.gratis||'').trim();if(!q)return '';
  var donde=BUS.gratisDonde||canalActual();
  var pre=donde==='instagram'?'site:instagram.com ':donde==='linkedin'?'site:linkedin.com/in ':'';
  var ex=comas(filtrosDe(canalActual()).excluir).slice(0,6).map(function(x){return ' -"'+x.replace(/"/g,'')+'"'}).join('');
  return 'https://www.google.com/search?q='+encodeURIComponent(pre+q+ex);
}

function yaEsta(r){var u=String(r.perfil||'').toLowerCase().replace(/\/$/,'');return lista().some(function(p){return [p.perfil,p.link].some(function(x){return x&&String(x).toLowerCase().replace(/\/$/,'')===u})})}
async function buscarAuto(){
  if(!CFG.puente||!CFG.codigo){toast('Falta configurar el puente. Ve a Perfil → Conexión.');return}
  var canal=BUS.canal||((S.meta.plan&&S.meta.plan.canales.map(function(c){return c.canal}).filter(function(c){return canalesAuto().indexOf(c)>-1})[0])||'instagram');
  var textos=textosPara(canal);
  if(!textos.length){toast('Primero completa tu cliente ideal en Perfil.');return}
  BUS.canal=canal;BUS.paso='';BUS.cargando=true;BUS.error='';BUS.resultados=null;render();
  try{
    var r=await fetch(CFG.puente.replace(/\/$/,'')+'/buscar',{method:'POST',headers:{'content-type':'application/json','x-codigo':CFG.codigo},
      body:JSON.stringify({textos:textos,canal:canal,cantidad:BUS.cantidad,perfilCliente:textoPerfilCliente(),excluir:comas(filtrosDe(canal).excluir),
        filtro:canal==='instagram'?{minSeguidores:Number(filtrosDe(canal).min)||0,maxSeguidores:Number(filtrosDe(canal).max)||5000}:null})});
    var d=await r.json().catch(function(){return {}});
    if(!r.ok)throw new Error(d.error||('El puente respondió '+r.status));
    BUS.resultados=ordenarPorSenales(d.resultados);BUS.resumen=d.resumen||null;BUS.marca={};BUS.abierto=-1;
    var rg={id:nuevoId(),fecha:hoy(),canal:canal,pedidos:BUS.cantidad,encontrados:BUS.resultados.length,
      revisados:(d.resumen&&d.resumen.encontrados)||BUS.resultados.length,costo:Number(d.costoUsd)||0,agregados:0,noCalza:{}};
    registro().unshift(rg);if(registro().length>80)registro().length=80;BUS.reg=rg.id;BUS.fechaRes=hoy();guardarUltima();
  }catch(e){BUS.error=/Failed to fetch|NetworkError|Load failed/i.test(String(e.message))?'Se cortó la conexión mientras buscaba. Inténtalo de nuevo.':String(e.message);restaurarUltima()}
  BUS.cargando=false;render();
}
function agregarResultado(i,despues){
  var r=BUS.resultados&&BUS.resultados[i];if(!r||yaEsta(r))return null;
  var extra=r.seguidores!=null?(' · '+r.seguidores+' seguidores, '+r.publicaciones+' publicaciones'):'';
  var np=normal({id:nuevoId(),nombre:(r.nombre||r.usuario||'Sin nombre').slice(0,80),canal:CANALES[r.canal]?r.canal:'otro',link:r.perfil||'',perfil:r.perfil||'',
    notas:(r.usuario?'@'+r.usuario+extra+'\n':'')+(r.bio||''),origen:'radar',estado:despues?'revisar':'nuevo',busId:BUS.reg||''});
  if(np.canal==='google')np.canal='otro';

  if(!BUS.marca[i]){BUS.marca[i]=despues?'despues':'agregada';var rg=regActual();if(rg&&!despues){rg.agregados++}guardarUltima()}
  return np;
}

function limpiaPlan(r){

  var s=r.senales||{};
  var sen={necesidad:txt(s.necesidad,5),afinidad:txt(s.afinidad,5),capacidad:txt(s.capacidad,5)};
  return {resumen:String(r.resumen||b.resumen).slice(0,260),tipo:r.tipo==='lugares'?'lugares':'personas',
    canales:can.length?can:b.canales,busquedas:bus.length?bus:b.busquedas,

}

         return '<button data-act="punto" data-d="'+d[0]+'" data-v="'+n+'" aria-pressed="'+(p.calificado&&Number(p[d[0]])===n)+'">'+n+'</button>'}).join('')+'</div></div>'}).join('')+'</section>'+
   '<section class="sec"><h3>'+(e==='contactada'?'Mensaje de seguimiento':'Mensaje')+'</h3><p class="nota">La app lo prepara. Tú lo revisas y lo envías desde '+CANALES[p.canal]+'.</p>'+
     '<label class="campo" for="fp-mensaje"><span hidden>Mensaje</span><textarea id="fp-mensaje" data-pf="mensaje" style="min-height:130px">'+esc(p.mensaje||mensajeBase(p))+'</textarea></label>'+
     '<div class="fila"><button class="btn" data-act="copiar">Copiar mensaje</button>'+(IA?'<button class="btn sec2" data-act="ia-msj"'+(ocupada?' disabled':'')+'>'+(ocupada==='msj'?'Pensando…':'Escribir con IA')+'</button>':'')+'</div></section>'+
   '<section class="sec"><h3>¿Qué pasó?</h3>'+avisoSeg+(acciones?'<div class="fila">'+acciones+'</div>':'')+
     '<label class="campo" for="fp-estado">Cambiar etapa a mano<select id="fp-estado" data-pf="estado">'+ETAPAS.map(function(x){return '<option value="'+x[0]+'"'+(e===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></label>'+
     '<div class="fila">'+(e!=='descartada'&&e!=='cliente'?'<button class="btn peligro" data-act="etapa" data-v="descartar">Descartar</button>':'')+
     '<button class="btn peligro" data-act="borrar">'+(borrarListo?'Toca otra vez para borrar':'Borrar prospecto')+'</button></div></section></div>';
}
function linksPerfil(p){
  var dom={instagram:'instagram.com',linkedin:'linkedin.com',facebook:'facebook.com'}[p.canal],ok=/^https?:\/\//i;
  var perfil=ok.test(p.perfil)?p.perfil:(dom&&ok.test(p.link)&&p.link.indexOf(dom)>-1?p.link:''),L=[];
  if(perfil)L.push(['Abrir su '+CANALES[p.canal],perfil]);
  else if(dom){var q=encodeURIComponent((p.buscar||p.nombre).replace(/[()]/g,' ').replace(/\s+/g,' ').trim());
    if(p.canal==='linkedin')L.push(['Buscarla en LinkedIn','https://www.linkedin.com/search/results/people/?keywords='+q]);
    else if(p.canal==='facebook')L.push(['Buscarla en Facebook','https://www.facebook.com/search/people/?q='+q]);
    else L.push(['Buscar su Instagram','https://www.google.com/search?q='+encodeURIComponent('site:instagram.com ')+q]);}
  if(ok.test(p.link)&&p.link!==perfil)L.push(['Ver dónde la encontré',p.link]);
  return L.length?'<div class="links">'+L.map(function(l){return '<a href="'+esc(l[1])+'" target="_blank" rel="noopener">'+l[0]+'</a>'}).join('')+'</div>':'';
}
function regDe(p){return registro().filter(function(b){return b.id===p.busId})[0]||null}
function mover(p,a){
  var h=hoy();
  if(a==='calza'){p.estado=p.calificado?'listo':'nuevo';var rg=regDe(p);if(rg){rg.agregados++;Store.meta()}Store.pro(p);return}
  if(a.indexOf('nocalza:')===0){var m=a.slice(8);p.estado='descartada';p.motivoNo=m;var rg2=regDe(p);if(rg2){rg2.noCalza[m]=(rg2.noCalza[m]||0)+1;Store.meta()}Store.pro(p);return}
  if(a==='enviada'){p.estado='contactada';p.contactadaEn=p.contactadaEn||h;p.ultimoEnvio=h;p.proximoSeg=enDias(3);if(!p.mensaje){var t=$('#fp-mensaje');if(t)p.mensaje=t.value}}
  else if(a==='seguimiento'){p.seguimientos=(p.seguimientos||0)+1;p.ultimoEnvio=h;p.proximoSeg=enDias(4)}
  else if(a==='respondio'){p.estado='conversacion';p.respondioEn=p.respondioEn||h;p.proximoSeg=''}
  else if(a==='propuesta'){p.estado='propuesta'}
  else if(a==='cliente'){p.estado='cliente';p.clienteEn=h;p.respondioEn=p.respondioEn||h;p.contactadaEn=p.contactadaEn||h}
  else if(a==='descartar'){p.estado='descartada';p.proximoSeg=''}
  Store.pro(p);
}
var tRel=0;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tRel);tRel=setTimeout(function(){t.hidden=true},3200)}

/* ---------- Eventos ---------- */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,v=b.dataset.v,p=hoja&&hoja.id?S.pros[hoja.id]:null;
  if(a!=='borrar')borrarListo=false;
  if(a==='cf-guardar'){
    var c={sbUrl:$('#cf-url').value.trim().replace(/\/$/,''),sbKey:$('#cf-key').value.trim(),puente:$('#cf-puente').value.trim().replace(/\/$/,''),codigo:$('#cf-codigo').value.trim()};
    if(!/^https:\/\/.+/.test(c.sbUrl)||c.sbKey.length<20){acceso.msg='Revisa la dirección del proyecto y la clave pública de Supabase.';CFG=Object.assign(CFG,c);pantallaConexion();return}
    CFG=c;guardarCfg(c);acceso.msg='';SB=null;arrancar();return}
  if(a==='ac-modo'){acceso.modo=v;acceso.msg='';pantallaLogin();return}
  if(a==='ac-enviar'){enviarAcceso();return}
  if(a==='ac-conexion'){acceso.msg='';pantallaConexion();return}
  if(a==='salir'){cerrarSesion();return}
  if(a==='bus-ir'){buscarAuto();return}
  if(a==='reintentar'){arrancar();return}
  if(a==='bus-recuperar'){recuperarUltima();return}
  if(a==='gratis-sug'){BUS.gratis=v;render();return}
  if(a==='gratis-donde'){BUS.gratisDonde=v;render();return}
  if(a==='bus-revisar'){BUS.paso='validar';render();return}
  if(a==='bus-volver'){BUS.paso='';BUS.verFiltros=true;render();return}
  if(a==='fil-proponer'){var c0=canalActual(),antes=JSON.stringify(filtrosDe(c0)),nuevo=proponerFiltros(c0);S.meta.filtros[c0]=nuevo;Store.meta();BUS.verFiltros=true;BUS.paso='';render();
    toast(antes===JSON.stringify(nuevo)?'Tus filtros ya son los que propone tu perfil. Si cambias tu perfil, la propuesta cambia.':'Filtros actualizados según tu perfil. Revísalos y ajústalos.');
    var el=$('#fil-bus');if(el){el.style.transition='background .6s';el.style.background='var(--dorado-suave)';setTimeout(function(){el.style.background=''},1200)}return}
  if(a==='fil-fix'){BUS.verFiltros=true;BUS.canal=aplicarMejora(canalActual(),v);Store.meta();render();return}
  if(a==='fil-todas'){BUS.verFiltros=true;var vv=validarBusqueda(canalActual());vv.items.forEach(function(i){if(i.fix&&i.fix.indexOf('canal-')!==0)aplicarMejora(canalActual(),i.fix)});Store.meta();render();toast('Mejoras aplicadas. Revisa el nuevo puntaje.');return}
  if(a==='bus-no'){BUS.abierto=Number(v);render();return}
  if(a==='bus-motivo'){var i2=Number(v);if(!BUS.marca[i2]){BUS.marca[i2]='no:'+b.dataset.m;var rg=regActual();if(rg){rg.noCalza[b.dataset.m]=(rg.noCalza[b.dataset.m]||0)+1}guardarUltima()}BUS.abierto=-1;render();return}
  if(a==='bus-uno'){if(agregarResultado(Number(v)))toast('Agregada a tu lista. Ponle puntaje en Prospectos.');render();return}
  if(a==='bus-despues'){if(agregarResultado(Number(v),true))toast('Guardada en Prospectos → Por revisar.');render();return}
  if(a==='bus-todos-despues'){var n2=0;(BUS.resultados||[]).forEach(function(r,i){if(!BUS.marca[i]&&agregarResultado(i,true))n2++});toast(n2?n2+' guardadas en Por revisar.':'No quedaban perfiles sin revisar.');render();return}
  if(a==='bus-todos'){var n=0;(BUS.resultados||[]).forEach(function(r,i){if(agregarResultado(i))n++});toast(n?n+' agregadas a tu lista.':'Ya estaban todas en tu lista.');render();return}
  if(a==='tab'){S.tab=v;render();window.scrollTo(0,0)}
  else if(a==='filtro'){S.filtro=v;S.tab='prospectos';render()}
  else if(a==='plan'){S.meta.filtros={};crearPlan()}
  else if(a==='ficha'){var pf=S.meta.perfil,c=b.dataset.c;
    if(b.dataset.multi){var arr=(pf[c]||[]).slice(),k=arr.indexOf(v);if(k>-1)arr.splice(k,1);else arr.push(v);pf[c]=arr}
    else pf[c]=pf[c]===v?'':v;
    Store.meta();render()}
  else if(a==='ficha-add'){var pf2=S.meta.perfil,c2=b.dataset.c,l2=comas(pf2[c2]);l2.push(v);pf2[c2]=l2.join(', ');Store.meta();render()}
  else if(a==='hecha'){S.meta.hechas[v]=hoy();Store.meta();setTimeout(render,400)}
  else if(a==='nuevo'){var pl=S.meta.plan;hoja={tipo:'nuevo',d:{nombre:'',canal:v||(pl&&pl.canales[0]?pl.canales[0].canal:'instagram'),link:'',notas:''}};pintaHoja();$('#hoja').scrollTop=0}
  else if(a==='abrir'){hoja={tipo:'pro',id:v};pintaHoja();$('#hoja').scrollTop=0}
  else if(a==='cerrar'){hoja=null;pintaHoja();render()}
  else if(a==='guardar'){var d=hoja.d;if(!d.nombre.trim()){toast('Ponle un nombre para reconocerla.');return}
    var np=normal({id:nuevoId(),nombre:d.nombre.trim(),canal:d.canal,link:d.link.trim(),notas:d.notas.trim()});
    S.pros[np.id]=np;Store.pro(np);hoja={tipo:'pro',id:np.id};pintaHoja();render();$('#hoja').scrollTop=0;
    if(v==='ia')calificarIA(np);else toast('Guardada. Ahora ponle puntaje.')}
  else if(!p){return}
  else if(a==='punto'){if(!p.calificado){p.n=p.n||0;p.a=p.a||0;p.c=p.c||0}p[b.dataset.d]=Number(v);p.calificado=true;if(p.estado==='nuevo')p.estado='listo';Store.pro(p);pintaHoja()}
  else if(a==='ia-cal'){calificarIA(p)}
  else if(a==='ia-msj'){mensajeIA(p)}
  else if(a==='copiar'){var t=$('#fp-mensaje'),txt=t.value;
    var falla=function(){t.focus();t.select();toast('Selecciónalo y cópialo a mano.')};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast('Mensaje copiado. Pégalo en '+CANALES[p.canal]+'.')},falla);else falla()}
  else if(a==='etapa'){mover(p,v);pintaHoja();toast(v==='enviada'?'Anotado. Te aviso en 3 días si no responde.':v==='cliente'?'¡Nueva clienta!':'Anotado.')}
  else if(a==='borrar'){if(!borrarListo){borrarListo=true;pintaHoja();return}borrarListo=false;Store.borrar(p.id);hoja=null;pintaHoja();render();toast('Prospecto borrado.')}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&(ev.target.id==='ac-pass'||ev.target.id==='ac-mail')){ev.preventDefault();enviarAcceso()}});
document.addEventListener('toggle',function(ev){if(ev.target&&ev.target.id==='det-fil')BUS.verFiltros=ev.target.open},true);
document.addEventListener('change',function(ev){
  if(ev.target.id!=='importar'||!ev.target.files[0])return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);if(!d||!Array.isArray(d.prospectos))throw 0;
      if(d.meta&&!S.meta.perfil.cliente.trim()){ponMeta(d.meta);Store.meta()}
      var n=0;d.prospectos.forEach(function(p){if(!p||!p.id||S.pros[p.id])return;S.pros[p.id]=normal(p);Store.pro(S.pros[p.id]);n++});
      toast(n+' prospectos importados.');render();
    }catch(e){toast('Ese archivo no es un respaldo de esta app.')}
  };
  fr.readAsText(ev.target.files[0]);
});
document.addEventListener('input',function(ev){
  var t=ev.target,ds=t.dataset;
  if(ds.gratis){BUS.gratis=t.value;var ga=$('#gratis-ir'),gu=urlGratis();if(ga){ga.href=gu||'#';ga.style.opacity=gu?'':'.55';ga.style.pointerEvents=gu?'':'none'}return}
  if(ds.fil){var ff=filtrosDe(canalActual());ff[ds.fil]=t.value;Store.meta();BUS.paso='';return}
  if(ds.bus){BUS[ds.bus]=ds.bus==='cantidad'?Number(t.value):t.value;BUS.paso='';render();return}
  if(ds.f){S.meta.perfil[ds.f]=t.type==='checkbox'?t.checked:t.value;Store.meta()}
  else if(ds.meta){var n=Math.round(Number(t.value));if(n>=1&&n<=30){S.meta.metaDiaria=n;Store.meta()}}
  else if(ds.nf&&hoja&&hoja.d){hoja.d[ds.nf]=t.value}
  else if(ds.pf&&hoja&&hoja.id&&S.pros[hoja.id]){var p=S.pros[hoja.id];
    if(ds.pf==='estado'){p.estado=t.value;if(t.value==='contactada'&&!p.contactadaEn){p.contactadaEn=hoy();p.proximoSeg=enDias(3)}
      if((t.value==='conversacion'||t.value==='propuesta'||t.value==='cliente')&&!p.respondioEn)p.respondioEn=hoy();
      Store.pro(p);pintaHoja()}
    else{p[ds.pf]=t.value;Store.pro(p)}}
});
document.addEventListener('focusout',function(){if(pendiente)setTimeout(refrescar,80)});

arrancar();
})();
