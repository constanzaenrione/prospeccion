<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prospección">

<!-- PROSPECCIÓN INTELIGENTE — APP VERSIÓN 3.4 (21 oct 2026) -->
<title>Prospección Inteligente</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</body>
</html>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: una columna de celular, barra de 5 pestañas abajo, ficha de prospecto a pantalla completa */
:root{
  --bg:#F8F5FB; --surface:#FFFFFF; --ink:#1F1630; --muted:#675C78; --line:#E4DCEE;
  --morado:#4B168E; --morado-suave:#EEE6F8; --dorado:#A0740F; --dorado-suave:#F6EEDB;
  --sobre-morado:#FFFFFF;
  --cal:#A8321C; --cal-bg:#FBE6E1; --tib:#8A6208; --tib-bg:#F6EEDB; --fri:#3F5A78; --fri-bg:#E4ECF4;
  --ok:#1E6B4A;
  --display:"Fraunces",Georgia,serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15101F; --surface:#201831; --ink:#F1ECF8; --muted:#A99FBC; --line:#35294B;
  --morado:#B794F0; --morado-suave:#2C2044; --dorado:#DDB04A; --dorado-suave:#33290F;
  --sobre-morado:#1A1028;
  --cal:#F2937D; --cal-bg:#3A1B15; --tib:#DDB04A; --tib-bg:#33290F; --fri:#9DB9D8; --fri-bg:#1B2838;
  --ok:#6FCFA4; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15101F; --surface:#201831; --ink:#F1ECF8; --muted:#A99FBC; --line:#35294B;
  --morado:#B794F0; --morado-suave:#2C2044; --dorado:#DDB04A; --dorado-suave:#33290F;
  --sobre-morado:#1A1028;
  --cal:#F2937D; --cal-bg:#3A1B15; --tib:#DDB04A; --tib-bg:#33290F; --fri:#9DB9D8; --fri-bg:#1B2838;
  --ok:#6FCFA4; color-scheme:dark }

*{box-sizing:border-box}

[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--dorado);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}

.cabeza{position:sticky;top:0;z-index:6;background:var(--bg);box-shadow:0 1px 0 var(--line)}
.top{background:#4B168E;color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:1.25rem;color:#fff;display:flex;align-items:center;gap:8px;letter-spacing:.01em}
.top h1 svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2}
.top .lema{font-size:.78rem;opacity:.85;margin-top:2px}
.top .estado{color:#fff;opacity:.9;font-size:.75rem;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cuenta-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 12px 6px 8px;min-height:40px}
.cuenta-btn svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round}
.estado{font-size:.75rem;color:var(--muted);text-align:right}

.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h2{font-size:1.3rem}
.sec>h3{font-size:1.05rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--dorado);font-weight:600}
.nota{color:var(--muted);font-size:.9rem}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;max-width:560px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 16px;
  font-size:.9rem;font-weight:600;color:var(--morado);white-space:nowrap;min-height:42px}
.tabs button[aria-current="page"]{background:#4B168E;border-color:#4B168E;color:#fff}
@media (min-width:600px){.tabs{flex-wrap:wrap;overflow:visible;max-width:760px;justify-content:center}}

.btn{border:1px solid var(--morado);background:var(--morado);color:var(--sobre-morado);border-radius:12px;padding:12px 16px;font-weight:600;min-height:46px}
.btn.sec2{background:transparent;color:var(--morado)}
.btn.suave{background:var(--morado-suave);border-color:transparent;color:var(--morado)}
.btn.peligro{background:transparent;border-color:var(--line);color:var(--cal)}
.btn[disabled]{opacity:.55;cursor:default}
.fila{display:flex;flex-wrap:wrap;gap:8px}
.fila>.btn{flex:1 1 140px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.lista{display:flex;flex-direction:column;gap:8px}
.pro{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.pro b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.pro .sub{grid-column:1;color:var(--muted);font-size:.85rem;min-width:0;overflow-wrap:anywhere}
.pro .pt{grid-row:1 / span 2;grid-column:2}
.pt{font-variant-numeric:tabular-nums;font-weight:600;font-size:.85rem;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pt.cal{background:var(--cal-bg);color:var(--cal)} .pt.tib{background:var(--tib-bg);color:var(--tib)}
.pt.fri{background:var(--fri-bg);color:var(--fri)} .pt.sin{background:var(--morado-suave);color:var(--muted)}
.opcs{display:flex;flex-wrap:wrap;gap:8px}
.opc{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.88rem;min-height:40px;color:var(--ink,inherit)}
.opc[aria-pressed=true]{background:var(--morado);border-color:var(--morado);color:#fff}
.bloque{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface)}
.bloque h3{margin:0}
.paso-n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--dorado);color:#fff;font-size:.8rem;font-weight:600;margin-right:8px}
.chip{display:inline-block;font-size:.75rem;border-radius:999px;padding:3px 10px;background:var(--morado-suave);color:var(--morado);font-weight:500}

.avance{height:10px;border-radius:999px;background:var(--morado-suave);overflow:hidden}
.avance i{display:block;height:100%;background:var(--dorado);border-radius:999px}

label.campo{display:flex;flex-direction:column;gap:5px;font-size:.9rem;font-weight:500}
label.campo small{font-weight:400;color:var(--muted)}
input[type=text],input[type=url],input[type=number],input[type=email],input[type=password],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:92px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--morado);flex:none}

.canal{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline}
.canal .n{font-family:var(--display);font-size:1.5rem;color:var(--dorado);grid-row:1 / span 2;font-variant-numeric:tabular-nums}
.busq{display:flex;flex-direction:column;gap:8px}
.busq .txt{font-weight:600;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--morado);font-weight:600;font-size:.9rem;border:1px solid var(--line);border-radius:999px;padding:7px 12px;text-decoration:none}
.hecha{font-size:.8rem;color:var(--ok);font-weight:600}
ul.senales{margin:0;padding-left:18px;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:3px}

.filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filtros button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.85rem;color:var(--muted)}
.filtros button[aria-pressed="true"]{background:var(--morado);border-color:var(--morado);color:var(--sobre-morado);font-weight:600}

.grp{display:flex;flex-direction:column;gap:8px}
.grp>summary{cursor:pointer;font-weight:600;font-family:var(--display);font-size:1.02rem;padding:6px 0;list-style:none;display:flex;justify-content:space-between}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .cnt{font-family:var(--body);font-size:.85rem;color:var(--muted);font-weight:500}
.etq{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);margin:2px 4px 0 0}
.fila-em{display:grid;grid-template-columns:1fr 74px;gap:8px;align-items:end;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}
.fila-em .mini{display:flex;gap:6px;grid-column:1 / -1;flex-wrap:wrap;align-items:center}
.mini button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-height:36px}
.histo{margin:0;padding-left:18px;font-size:.86rem;color:var(--muted)}
.btn.wa{background:#1F7A4D;border-color:#1F7A4D;color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.fp{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column}
.fp-f{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 12px}
.fp-n{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:0;color:inherit}
.fp-n b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-n small{display:block;font-size:.8rem;color:var(--muted)}
.av{width:40px;height:40px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.9rem;flex:none}
.ib{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--line);background:var(--surface);color:var(--morado);font-weight:700}
.ib.wa{background:#E3F2EA;border-color:#E3F2EA}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ba{height:44px;border-radius:12px;background:var(--morado);color:var(--sobre-morado);border:0;padding:0 12px;font-weight:600;font-size:.88rem;flex:none}
.ba.sec2{background:var(--surface);color:var(--morado);border:1px solid var(--line)}
.fp-menu{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.desp{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.desp>summary{list-style:none;cursor:pointer;padding:14px;display:flex;justify-content:space-between;align-items:center;font-weight:600;min-height:56px;box-sizing:border-box}
.desp>summary::-webkit-details-marker{display:none}
.desp .cnt2{background:var(--morado-suave);color:var(--morado);border-radius:999px;padding:3px 11px;font-size:.88rem}
.desp .cuerpo{border-top:1px solid var(--line);padding:6px 6px 10px;display:flex;flex-direction:column;gap:6px}
.desp .fp{border:0}
.vacio-ag{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px;display:flex;align-items:center;gap:12px}
.vacio-ag svg{width:34px;height:34px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;flex:none}
.camino{display:flex;gap:2px;overflow-x:auto;padding-bottom:2px}
.camino button{flex:1 0 64px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;min-height:60px;color:var(--muted);font-size:.72rem;line-height:1.2;text-align:center}
.camino i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box;display:block;background:var(--surface)}
.camino .hecha i{background:var(--morado);border-color:var(--morado)}
.camino .actual i{border-color:var(--morado);box-shadow:0 0 0 3px var(--morado-suave)}
.camino .actual{color:var(--morado);font-weight:700}.camino .hecha{color:var(--ink)}
.accion{background:var(--morado-suave);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.accion .preg{font-family:var(--display);font-size:1.15rem;font-weight:600;line-height:1.3}
.embudo{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.embudo button{flex:1 0 74px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink)}
.embudo button b{font-family:var(--display);font-size:1.3rem}
.embudo button span{font-size:.7rem;line-height:1.15;text-align:center}
.embudo button[aria-pressed=true]{background:var(--morado);border-color:var(--morado);color:var(--sobre-morado)}
.tarj{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 20px rgba(75,22,142,.08)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trio button{min-height:64px;border-radius:16px;font-weight:600;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.trio .si{background:var(--morado);border-color:var(--morado);color:var(--sobre-morado)}
.trio .no{color:#A3341A;border-color:#E8C9C0}
.info-canales{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:.92rem;line-height:1.5}
.info-canales ol{margin:6px 0;padding-left:20px}
.hoja{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hoja .barra{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:1}
.hoja .barra button{background:none;border:0;color:var(--morado);font-weight:600;padding:8px 4px}
.hoja .wrap{padding-block:18px 40px}
.dim{display:flex;flex-direction:column;gap:6px}
.dim .cab{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.95rem}
.escala{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.escala button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 0;font-variant-numeric:tabular-nums}
.escala button[aria-pressed="true"]{background:var(--morado);border-color:var(--morado);color:var(--sobre-morado);font-weight:600}

.barras{display:flex;flex-direction:column;gap:10px}
.barra-f{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.9rem}
.barra-f .avance{grid-column:1 / -1}
.barra-f b{font-variant-numeric:tabular-nums}
.tabla{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500}

.vacio{text-align:left;padding:8px 0;display:flex;flex-direction:column;gap:12px}
.vacio h2{font-size:1.6rem;color:var(--morado)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;margin:0 auto;max-width:420px;
  background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:.9rem;text-align:center}
.acceso{max-width:440px;margin:0 auto;padding-inline:16px;padding-block:32px 60px;display:flex;flex-direction:column;gap:18px}
.acceso h2{font-size:1.7rem;color:var(--morado)}
.selector{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--morado-suave);padding:4px;border-radius:12px}
.selector button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:600;color:var(--morado)}
.selector button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.error{color:var(--cal);font-size:.9rem}
.res{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.res .sub{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere;grid-column:1}
.res b{overflow-wrap:anywhere}
.res .acc{grid-row:1 / span 3;grid-column:2}
.res .acc .btn{min-height:38px;padding:8px 12px;font-size:.85rem}
.costo{font-size:.82rem;color:var(--muted)}
</style>
</head>
<body>

<section class="acceso" id="acceso" hidden></section>

<div class="cabeza" id="cabeza">
<header class="top">
  <div><h1><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>Prospección Inteligente</h1><p class="lema">Encuentra · Califica · Conversa</p></div>
  <button class="cuenta-btn" data-act="cuenta" aria-label="Mi cuenta"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c1-3.8 4-5.6 7.5-5.6s6.5 1.8 7.5 5.6"/></svg><span class="estado" id="estado"></span></button>
</header>
<nav class="tabs" id="tabs" aria-label="Secciones"></nav>
</div>
<main class="wrap" id="view"></main>
<section class="hoja" id="hoja" hidden></section>
<div id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fecha(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hoy(){return fecha(new Date())}
function enDias(n){var d=new Date();d.setDate(d.getDate()+n);return fecha(d)}
function clon(o){return JSON.parse(JSON.stringify(o))}
function nuevoId(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

var CANALES={whatsapp:'WhatsApp',instagram:'Instagram',linkedin:'LinkedIn',facebook:'Facebook',google:'Google',otro:'Otro'};
/* ---------- Proceso de venta (editable por cada usuaria) ---------- */
var FIJAS={revisar:'Por revisar',nuevo:'Por calificar',listo:'Por contactar',contactada:'Le escribí',cliente:'Cliente',descanso:'No por ahora',descartada:'Descartada'};
var MEDIO_BASE=[{id:'conversacion',nombre:'Conversando',dias:4,fecha:false},{id:'invitada',nombre:'Invitada a conversar',dias:3,fecha:false},
  {id:'sesion',nombre:'Sesión agendada',dias:0,fecha:true},{id:'propuesta',nombre:'Propuesta hecha',dias:2,fecha:false}];
var SEG_BASE={primero:3,segundo:7,maxSeg:2,descanso:30};
var GRUPOS=[['cercana','🔥 Cercanas','Ya te conocen y mostraron interés'],['tibia','🌤 Tibias','Hicieron algo contigo, pero no avanzaron'],
  ['nueva','✨ Nuevas','Recién encontradas, por la app u otro medio'],['fria','❄️ Frías','Listas grandes o sin respuesta: solo mensajes generales'],['fuera','🚫 No contactar','Nunca aparecen para escribir']];
var RANGO={cercana:0,tibia:1,nueva:2,fria:3,fuera:4};
var MSJ_BASE={cercana:'Hola {nombre}, ¿cómo estás? Hace tiempo que no conversamos y me acordé de ti. Estoy en una etapa nueva de mi trabajo y me encantaría saber de ti. ¿Cómo va todo?',
  tibia:'Hola {nombre}, ¿cómo estás? Hace un tiempo estuvimos en contacto y quise saludarte. ¿Cómo te ha ido con tu proyecto?',
  nueva:'Hola {nombre}, ¿cómo estás? Vi tu perfil y me llamó la atención [algo real que viste]. ¿Te puedo hacer una pregunta cortita sobre tu trabajo?',
  fria:'Hola {nombre}, ¿cómo estás? Te escribo para contarte en qué estoy hoy y saber cómo estás tú.',

  var q2=si.length?'¿Muestra señales como "'+si.slice(0,2).join('" o "')+'"?':C.indexOf('empresa')>-1?'¿Tiene equipo a cargo?':C.indexOf('duena')>-1?'¿Tiene un negocio activo con clientes?':C.indexOf('particular')>-1?'¿Habla del problema que tú resuelves?':'¿Muestra que vende sesiones o servicios?';
  return ['¿Se presenta como '+w+'?',q2,'¿Es una persona, no una empresa u organización?']}
function preguntas(){var p=S.meta.perfil.preguntas||[],b=preguntasBase();return [0,1,2].map(function(i){return String(p[i]||'').trim()||b[i]})}
/* ---------- Búsqueda gratis: separa personas del texto de Google y les pone puntaje ---------- */
function parsearGoogle(txt){
  var L=String(txt||'').split(/\n/).map(function(x){return x.trim()}).filter(Boolean),marcas=[];
  var NO=/^(p|reel|reels|explore|stories|tv|accounts|about|directory|legal|web|tags|locations|popular|search|in|company|posts|pulse|jobs|school)$/i;
  L.forEach(function(l,i){var m;
    var re=/instagram\.com\s*(?:›|\/)\s*([A-Za-z0-9._]{2,30})/gi;while((m=re.exec(l)))marcas.push({i:i,canal:'instagram',u:m[1],nombre:nombreCerca(L,i,m[1])});
    var re2=/\(@([A-Za-z0-9._]{2,30})\)/g;while((m=re2.exec(l)))marcas.push({i:i,canal:'instagram',u:m[1],nombre:l.split('(@')[0].trim()});
    var re3=/linkedin\.com\s*(?:›|\/)\s*in\s*(?:›|\/)\s*([A-Za-z0-9-]{3,100})/gi;while((m=re3.exec(l)))marcas.push({i:i,canal:'linkedin',u:m[1],nombre:nombreCerca(L,i,'')})});
  marcas=marcas.filter(function(x){return !NO.test(x.u)});
  var out=[],vistos={};
  marcas.forEach(function(mk,n){var k=mk.canal+':'+mk.u.toLowerCase();if(vistos[k])return;vistos[k]=1;
    var fin=L.length;for(var q=n+1;q<marcas.length;q++){if((marcas[q].canal+':'+marcas[q].u.toLowerCase())!==k){fin=marcas[q].i;break}}
    var ctx=L.slice(mk.i,Math.max(mk.i+1,fin)).join(' ');
    var nom=marcas.filter(function(x){return (x.canal+':'+x.u.toLowerCase())===k&&x.nombre&&x.nombre!==x.u})[0];
    out.push({canal:mk.canal,usuario:mk.canal==='instagram'?mk.u:'',nombre:String((nom&&nom.nombre)||mk.u).replace(/\s*[•|]\s*Instagram.*$/i,'').replace(/\s*\|\s*LinkedIn.*$/i,'').slice(0,80),
      perfil:mk.canal==='instagram'?'https://www.instagram.com/'+mk.u+'/':'https://www.linkedin.com/in/'+mk.u+'/',texto:ctx.replace(/https?:\/\/\S+/g,'').slice(0,400)})});
  return out}
function nombreCerca(L,i,u){for(var k=i;k>=Math.max(0,i-2);k--){var t=L[k];if(/\(@/.test(t))return t.split('(@')[0].trim();if(/ - .*\|?\s*LinkedIn/i.test(t)||/ \| LinkedIn/i.test(t))return t.split(/ \| LinkedIn/i)[0].trim()}
  for(var j=i+1;j<=Math.min(L.length-1,i+2);j++){var t2=L[j];if(/\(@/.test(t2))return t2.split('(@')[0].trim();if(/LinkedIn/i.test(t2)&&t2.length<140)return t2.split(/ \| LinkedIn/i)[0].trim()}
  return u}
var ORG_RE=/escuela|academia|instituto|universidad|fundaci[oó]n|asociaci[oó]n|federaci[oó]n|comisi[oó]n|\bong\b|sin fines de lucro|somos una|cl[ií]nica|centro de|agencia|tienda|revista/i;
function puntuar(r){var t=norm(r.nombre+' '+r.usuario+' '+r.texto),pts=35,raz=[];
  var pal=palabrasCliente().concat(tiposSel().map(function(x){return x[2][0]})).filter(function(w){return t.indexOf(norm(w))>-1});
  if(pal.length){pts+=25;raz.push('se presenta como '+pal[0])}
  var si=senalesSi().filter(function(w){return t.indexOf(norm(w))>-1});if(si.length){pts+=Math.min(30,si.length*15);raz.push('dice: '+si.slice(0,3).join(', '))}
  var lg=lugares().filter(function(w){return t.indexOf(norm(w))>-1});if(lg.length){pts+=10;raz.push('en '+lg[0])}
  var ex=exclusionesFicha().concat(comas(filtrosDe(r.canal==='linkedin'?'linkedin':'instagram').excluir)).filter(function(w){return w&&t.indexOf(norm(w))>-1});
  if(ex.length){pts-=40;raz.push('ojo: menciona '+ex[0])}
  if(ORG_RE.test(r.nombre+' '+r.texto)){pts-=30;raz.push('parece organización')}
  r.pts=Math.max(0,Math.min(100,pts));r.razones=raz;return r}
function ordenarGratis(){var G=parsearGoogle(BUS.grTxt).map(puntuar).sort(function(a,b){return b.pts-a.pts});
  G.forEach(function(r){if(yaEsta(r))r.hecho='Ya está en tu lista'});BUS.gr=G;render();toast(G.length?G.length+' personas separadas y puntuadas.':'No encontré perfiles en el texto.')}
function agregarGratis(i,despues){var r=(BUS.gr||[])[i];if(!r||r.hecho)return;
  var n=Math.round(r.pts/20);var np=normal({id:nuevoId(),nombre:r.nombre,canal:r.canal,link:r.perfil,perfil:r.perfil,notas:(r.usuario?'@'+r.usuario+'\n':'')+r.texto,
    origen:'gratis',estado:despues?'revisar':'listo',calificado:!despues,n:n,a:n,c:n,motivo:'Puntaje automático: '+r.razones.join(' · '),perfilId:S.meta.perfilActivo||''});
  anota(np,'Agregado desde búsqueda gratis');S.pros[np.id]=np;Store.pro(np);r.hecho=despues?'Por revisar':'En tu lista';render()}

  var D=r.descartados.filter(function(x){return typeof x==='string'}),gratis=D.filter(function(x){return /sin costo/.test(x)}).length,leidos=D.length-gratis;

    '<ul class="senales">'+D.map(function(x){var m=/^@([\w.]+)/.exec(x);return '<li>'+(m?'<a href="https://www.instagram.com/'+esc(m[1])+'/" target="_blank" rel="noopener">@'+esc(m[1])+'</a>'+esc(x.slice(m[0].length)):esc(x))+'</li>'}).join('')+'</ul></details>':'')}

async function buscarAuto(){
  if(!CFG.puente){toast('Falta la dirección del puente de búsqueda.');return}
  var canal=BUS.canal||((S.meta.plan&&S.meta.plan.canales.map(function(c){return c.canal}).filter(function(c){return canalesAuto().indexOf(c)>-1})[0])||'instagram');
  if(saldoCred()<=0){toast('Se acabaron tus créditos. Pídele más a tu mentora.');return}
  var textos=busquedasListas(canal);
  if(busquedasMalas(canal).length){BUS.paso='validar';render();toast('Hay búsquedas de una sola palabra. Agrega más palabras o tu país antes de buscar.');return}
  if(!textos.length){toast('Primero completa tu cliente ideal en Perfil.');return}
  BUS.canal=canal;BUS.paso='';BUS.cargando=true;BUS.error='';BUS.resultados=null;render();
  try{
    var r=await fetch(CFG.puente.replace(/\/$/,'')+'/buscar',{method:'POST',headers:await cabeceras(),
      body:JSON.stringify({textos:textos,canal:canal,modo:canal==='instagram'?modoIG():'',idioma:idiomaBus(),pais:paisBus(),cantidad:BUS.cantidad,perfilCliente:textoPerfilCliente(),excluir:comas(filtrosDe(canal).excluir),
        filtro:canal==='instagram'?filtroSeg(filtrosDe(canal)):null})});
    var d=await r.json().catch(function(){return {}});
    if(!r.ok)throw new Error(d.error||('El puente respondió '+r.status));
    BUS.resultados=ordenarPorSenales(d.resultados);BUS.resumen=d.resumen||null;BUS.marca={};BUS.abierto=-1;
    var rg={id:nuevoId(),fecha:hoy(),canal:canal,pedidos:BUS.cantidad,encontrados:BUS.resultados.length,
      revisados:(d.resumen&&d.resumen.encontrados)||BUS.resultados.length,costo:Number(d.costoUsd)||0,agregados:0,noCalza:{}};
    S.meta.gastoUsd=gastadoUsd()+(Number(d.costoUsd)||0);
    registro().unshift(rg);if(registro().length>80)registro().length=80;BUS.reg=rg.id;BUS.fechaRes=hoy();guardarUltima();
  }catch(e){BUS.error=/Failed to fetch|NetworkError|Load failed/i.test(String(e.message))?'Se cortó la conexión mientras buscaba. Inténtalo de nuevo.':String(e.message);restaurarUltima()}
  BUS.cargando=false;render();
}

    try{
