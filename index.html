<style>
/* Layout: una columna de celular, barra de 5 pestañas abajo, ficha de prospecto a pantalla completa */
:root{
  --bg:#F8F5FB; --surface:#FFFFFF; --ink:#1F1630; --muted:#675C78; --line:#E4DCEE;
  --morado:#4B168E; --morado-suave:#EEE6F8; --dorado:#A0740F; --dorado-suave:#F6EEDB;
  --sobre-morado:#FFFFFF;
  --cal:#A8321C; --cal-bg:#FBE6E1; --tib:#8A6208; --tib-bg:#F6EEDB; --fri:#3F5A78; --fri-bg:#E4ECF4;
  --ok:#1E6B4A;
  --display:"Fraunces",Georgia,serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15101F; --surface:#201831; --ink:#F1ECF8; --muted:#A99FBC; --line:#35294B;
  --morado:#B794F0; --morado-suave:#2C2044; --dorado:#DDB04A; --dorado-suave:#33290F;
  --sobre-morado:#1A1028;
  --cal:#F2937D; --cal-bg:#3A1B15; --tib:#DDB04A; --tib-bg:#33290F; --fri:#9DB9D8; --fri-bg:#1B2838;
  --ok:#6FCFA4; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15101F; --surface:#201831; --ink:#F1ECF8; --muted:#A99FBC; --line:#35294B;
  --morado:#B794F0; --morado-suave:#2C2044; --dorado:#DDB04A; --dorado-suave:#33290F;
  --sobre-morado:#1A1028;
  --cal:#F2937D; --cal-bg:#3A1B15; --tib:#DDB04A; --tib-bg:#33290F; --fri:#9DB9D8; --fri-bg:#1B2838;
  --ok:#6FCFA4; color-scheme:dark }

*{box-sizing:border-box}

[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--dorado);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}

.cabeza{position:sticky;top:0;z-index:6;background:var(--bg);box-shadow:0 1px 0 var(--line)}
.top{background:#4B168E;color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:1.25rem;color:#fff;display:flex;align-items:center;gap:8px;letter-spacing:.01em}
.top h1 svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2}
.top .lema{font-size:.78rem;opacity:.85;margin-top:2px}
.top .estado{color:#fff;opacity:.85}
.estado{font-size:.75rem;color:var(--muted);text-align:right}

.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h2{font-size:1.3rem}
.sec>h3{font-size:1.05rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--dorado);font-weight:600}
.nota{color:var(--muted);font-size:.9rem}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;max-width:560px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 16px;
  font-size:.9rem;font-weight:600;color:var(--morado);white-space:nowrap;min-height:42px}
.tabs button[aria-current="page"]{background:#4B168E;border-color:#4B168E;color:#fff}
@media (min-width:600px){.tabs{flex-wrap:wrap;overflow:visible;max-width:760px;justify-content:center}}

.btn{border:1px solid var(--morado);background:var(--morado);color:var(--sobre-morado);border-radius:12px;padding:12px 16px;font-weight:600;min-height:46px}
.btn.sec2{background:transparent;color:var(--morado)}
.btn.suave{background:var(--morado-suave);border-color:transparent;color:var(--morado)}
.btn.peligro{background:transparent;border-color:var(--line);color:var(--cal)}
.btn[disabled]{opacity:.55;cursor:default}
.fila{display:flex;flex-wrap:wrap;gap:8px}
.fila>.btn{flex:1 1 140px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.lista{display:flex;flex-direction:column;gap:8px}
.pro{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.pro b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.pro .sub{grid-column:1;color:var(--muted);font-size:.85rem;min-width:0;overflow-wrap:anywhere}
.pro .pt{grid-row:1 / span 2;grid-column:2}
.pt{font-variant-numeric:tabular-nums;font-weight:600;font-size:.85rem;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pt.cal{background:var(--cal-bg);color:var(--cal)} .pt.tib{background:var(--tib-bg);color:var(--tib)}
.pt.fri{background:var(--fri-bg);color:var(--fri)} .pt.sin{background:var(--morado-suave);color:var(--muted)}
.opcs{display:flex;flex-wrap:wrap;gap:8px}
.opc{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.88rem;min-height:40px;color:var(--ink,inherit)}
.opc[aria-pressed=true]{background:var(--morado);border-color:var(--morado);color:#fff}
.bloque{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface)}
.bloque h3{margin:0}
.paso-n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--dorado);color:#fff;font-size:.8rem;font-weight:600;margin-right:8px}
.chip{display:inline-block;font-size:.75rem;border-radius:999px;padding:3px 10px;background:var(--morado-suave);color:var(--morado);font-weight:500}

.avance{height:10px;border-radius:999px;background:var(--morado-suave);overflow:hidden}
.avance i{display:block;height:100%;background:var(--dorado);border-radius:999px}

label.campo{display:flex;flex-direction:column;gap:5px;font-size:.9rem;font-weight:500}
label.campo small{font-weight:400;color:var(--muted)}
input[type=text],input[type=url],input[type=number],input[type=email],input[type=password],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:92px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--morado);flex:none}

.canal{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline}
.canal .n{font-family:var(--display);font-size:1.5rem;color:var(--dorado);grid-row:1 / span 2;font-variant-numeric:tabular-nums}
.busq{display:flex;flex-direction:column;gap:8px}
.busq .txt{font-weight:600;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--morado);font-weight:600;font-size:.9rem;border:1px solid var(--line);border-radius:999px;padding:7px 12px;text-decoration:none}
.hecha{font-size:.8rem;color:var(--ok);font-weight:600}
ul.senales{margin:0;padding-left:18px;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:3px}

.filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filtros button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.85rem;color:var(--muted)}
.filtros button[aria-pressed="true"]{background:var(--morado);border-color:var(--morado);color:var(--sobre-morado);font-weight:600}

.grp{display:flex;flex-direction:column;gap:8px}
.grp>summary{cursor:pointer;font-weight:600;font-family:var(--display);font-size:1.02rem;padding:6px 0;list-style:none;display:flex;justify-content:space-between}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .cnt{font-family:var(--body);font-size:.85rem;color:var(--muted);font-weight:500}
.etq{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);margin:2px 4px 0 0}
.fila-em{display:grid;grid-template-columns:1fr 74px;gap:8px;align-items:end;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}
.fila-em .mini{display:flex;gap:6px;grid-column:1 / -1;flex-wrap:wrap;align-items:center}
.mini button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-height:36px}
.histo{margin:0;padding-left:18px;font-size:.86rem;color:var(--muted)}
.btn.wa{background:#1F7A4D;border-color:#1F7A4D;color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.hoja{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hoja .barra{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:1}
.hoja .barra button{background:none;border:0;color:var(--morado);font-weight:600;padding:8px 4px}
.hoja .wrap{padding-block:18px 40px}
.dim{display:flex;flex-direction:column;gap:6px}
.dim .cab{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.95rem}
.escala{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.escala button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 0;font-variant-numeric:tabular-nums}
.escala button[aria-pressed="true"]{background:var(--morado);border-color:var(--morado);color:var(--sobre-morado);font-weight:600}

.barras{display:flex;flex-direction:column;gap:10px}
.barra-f{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.9rem}
.barra-f .avance{grid-column:1 / -1}
.barra-f b{font-variant-numeric:tabular-nums}
.tabla{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500}

.vacio{text-align:left;padding:8px 0;display:flex;flex-direction:column;gap:12px}
.vacio h2{font-size:1.6rem;color:var(--morado)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;margin:0 auto;max-width:420px;
  background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:.9rem;text-align:center}
.acceso{max-width:440px;margin:0 auto;padding-inline:16px;padding-block:32px 60px;display:flex;flex-direction:column;gap:18px}
.acceso h2{font-size:1.7rem;color:var(--morado)}
.selector{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--morado-suave);padding:4px;border-radius:12px}
.selector button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:600;color:var(--morado)}
.selector button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.error{color:var(--cal);font-size:.9rem}
.res{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.res .sub{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere;grid-column:1}
.res b{overflow-wrap:anywhere}
.res .acc{grid-row:1 / span 3;grid-column:2}
.res .acc .btn{min-height:38px;padding:8px 12px;font-size:.85rem}
.costo{font-size:.82rem;color:var(--muted)}
</style>
</head>
<body>

<section class="acceso" id="acceso" hidden></section>

<div class="cabeza" id="cabeza">
<header class="top">
  <div><h1><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>Prospección Inteligente</h1><p class="lema">Encuentra · Califica · Conversa</p></div>
  <div class="estado" id="estado"></div>
</header>
<nav class="tabs" id="tabs" aria-label="Secciones"></nav>
</div>
<main class="wrap" id="view"></main>
<section class="hoja" id="hoja" hidden></section>
<div id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fecha(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hoy(){return fecha(new Date())}
function enDias(n){var d=new Date();d.setDate(d.getDate()+n);return fecha(d)}
function clon(o){return JSON.parse(JSON.stringify(o))}
function nuevoId(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

var CANALES={whatsapp:'WhatsApp',instagram:'Instagram',linkedin:'LinkedIn',facebook:'Facebook',google:'Google',otro:'Otro'};
/* ---------- Proceso de venta (editable por cada usuaria) ---------- */
var FIJAS={revisar:'Por revisar',nuevo:'Por calificar',listo:'Por contactar',contactada:'Le escribí',cliente:'Clienta',descanso:'No por ahora',descartada:'Descartada'};
var MEDIO_BASE=[{id:'conversacion',nombre:'Conversando',dias:4,fecha:false},{id:'invitada',nombre:'Invitada a conversar',dias:3,fecha:false},
  {id:'sesion',nombre:'Sesión agendada',dias:0,fecha:true},{id:'propuesta',nombre:'Propuesta hecha',dias:2,fecha:false}];
var SEG_BASE={primero:3,segundo:7,maxSeg:2,descanso:30};
var GRUPOS=[['cercana','🔥 Cercanas','Ya te conocen y mostraron interés'],['tibia','🌤 Tibias','Hicieron algo contigo, pero no avanzaron'],
  ['nueva','✨ Nuevas','Recién encontradas, por la app u otro medio'],['fria','❄️ Frías','Listas grandes o sin respuesta: solo mensajes generales'],['fuera','🚫 No contactar','Nunca aparecen para escribir']];
var RANGO={cercana:0,tibia:1,nueva:2,fria:3,fuera:4};
var MSJ_BASE={cercana:'Hola {nombre}, ¿cómo estás? Hace tiempo que no conversamos y me acordé de ti. Estoy en una etapa nueva de mi trabajo y me encantaría saber de ti. ¿Cómo va todo?',
  tibia:'Hola {nombre}, ¿cómo estás? Hace un tiempo estuvimos en contacto y quise saludarte. ¿Cómo te ha ido con tu proyecto?',
  nueva:'Hola {nombre}, ¿cómo estás? Vi tu perfil y me llamó la atención [algo real que viste]. ¿Te puedo hacer una pregunta cortita sobre tu trabajo?',
  fria:'Hola {nombre}, ¿cómo estás? Te escribo para contarte en qué estoy hoy y saber cómo estás tú.',
  seguimiento:'Hola {nombre}, te escribo de nuevo por si se te pasó mi mensaje. Sin apuro 😊 ¿Cómo estás?'};
function medio(){return Array.isArray(S.meta.etapasMedio)?S.meta.etapasMedio:MEDIO_BASE}
function nombreFija(id){return ((S.meta.nombresEtapa||{})[id]||'').trim()||FIJAS[id]}
function etapas(){var r=[['revisar',nombreFija('revisar')],['nuevo',nombreFija('nuevo')],['listo',nombreFija('listo')],['contactada',nombreFija('contactada')]];
  medio().forEach(function(m){r.push([m.id,m.nombre||'Sin nombre'])});
  return r.concat([['cliente',nombreFija('cliente')],['descanso',nombreFija('descanso')],['descartada',nombreFija('descartada')]])}
function nombreEtapa(e){var E=etapas();for(var i=0;i<E.length;i++)if(E[i][0]===e)return E[i][1];return e}
function etapaMedio(id){return medio().filter(function(x){return x.id===id})[0]||null}
function sigDe(id){var m=medio(),i=m.map(function(x){return x.id}).indexOf(id);if(id==='contactada')return m[0]?m[0].id:'cliente';if(i>-1)return m[i+1]?m[i+1].id:'cliente';return ''}
function seg(){return Object.assign({},SEG_BASE,S.meta.seg||{})}
function msjBase(g){var m=S.meta.mensajes||{};return String(m[g]||'').trim()||MSJ_BASE[g]||MSJ_BASE.nueva}
function grupoDe(p){return RANGO[p.grupo]!=null?p.grupo:'nueva'}
function nombreGrupo(g){return (GRUPOS.filter(function(x){return x[0]===g})[0]||GRUPOS[2])[1]}
function diaAntes(d){var x=new Date(d+'T12:00:00');if(isNaN(x))return '';x.setDate(x.getDate()-1);return fecha(x)}
function anota(p,t){if(!Array.isArray(p.historial))p.historial=[];p.historial.unshift({f:hoy(),t:t});if(p.historial.length>40)p.historial.length=40}
function digitos(t){return String(t||'').replace(/\D/g,'')}
function waLink(p,txt){var d=digitos(p.telefono);return d.length>=8?'https://wa.me/'+d+(txt?'?text='+encodeURIComponent(txt):''):''}
var DIMS=[['n','necesidad','Necesidad'],['a','afinidad','Afinidad'],['c','capacidad','Capacidad de compra']];

var S={meta:{perfil:{oferta:'',cliente:'',problema:'',palabras:'',lugar:'',precio:'',baseLista:false,tipos:[],otrosTipos:'',momento:'',senalesSi:'',noQuiero:[],noQuieroTxt:'',categoria:'',categorias:[],momentos:[],momentoTxt:''},plan:null,hechas:{},metaDiaria:5},
       pros:{},tab:'hoy',filtro:'todos'};
var IA=null, ocupada='', hoja=null, borrarListo=false, pendiente=false;

/* ---------- Conexión (se guarda solo en este dispositivo) ---------- */
var CFG_LS='pi-conexion';
function leerCfg(){try{return JSON.parse(localStorage.getItem(CFG_LS)||'null')}catch(e){return null}}
function guardarCfg(c){try{localStorage.setItem(CFG_LS,JSON.stringify(c))}catch(e){}}
/* Conexión fija: las personas solo escriben su correo y contraseña */
var CONEXION={sbUrl:'https://zcovuvkqsmnedfnevmpm.supabase.co',sbKey:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpjb3Z1dmtxc21uZWRmbmV2bXBtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4NDUyOTIsImV4cCI6MjA5ODQyMTI5Mn0.1VXulShYlMcTsqUgSicfzOzsVS8tS4rLD_gpgn31cPo',puente:'https://puente-prospeccion.conyenrione.workers.dev'};
function conexionFija(){return !/^__/.test(CONEXION.sbUrl)&&!/^__/.test(CONEXION.sbKey)}
var CFG=conexionFija()?{sbUrl:CONEXION.sbUrl,sbKey:CONEXION.sbKey,puente:CONEXION.puente,codigo:''}:(leerCfg()||{sbUrl:'',sbKey:'',puente:CONEXION.puente,codigo:''});
async function cabeceras(){var h={'content-type':'application/json'};if(CFG.codigo)h['x-codigo']=CFG.codigo;
  try{var s=await SB.auth.getSession();if(s.data&&s.data.session)h.authorization='Bearer '+s.data.session.access_token}catch(e){}return h}
var SB=null, UID=null;

/* ---------- Guardado en Supabase ---------- */
var Store={colas:{},relojes:{},error:false,
  cacheKey:function(){return 'pi-cache-'+(UID||'x')},
  leerLocal:function(){try{var r=JSON.parse(localStorage.getItem(this.cacheKey())||'null');if(r){ponMeta(r.meta);S.pros=r.pros||{}}}catch(e){}},
  guardarLocal:function(){try{localStorage.setItem(this.cacheKey(),JSON.stringify({meta:S.meta,pros:S.pros}))}catch(e){}},
  enFila:function(k,fn){var self=this;var p=(this.colas[k]||Promise.resolve()).then(fn).then(function(r){if(r&&r.error)throw r.error;self.ok()}).catch(function(){self.falla()});this.colas[k]=p;return p},
  ok:function(){if(this.error){this.error=false;pintaEstado()}},
  falla:function(){this.error=true;pintaEstado();toast('No se pudo guardar en tu cuenta. Revisa tu conexión a internet.')},

/* ---------- Filtros de búsqueda: propuesta y validación ---------- */
function norm(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}

  var p=S.meta.perfil,L=lugares(),b2b=esB2B();

  var bus=roles.slice(0,4).map(function(r,i){var lg=L.length?L[i%L.length]:'';return (r+' '+(L.some(function(x){return norm(r).indexOf(norm(x))>-1})?'':lg)).trim()});

    if(dePlan.length)bus=dePlan.concat(bus).filter(function(x,i,a){return a.map(norm).indexOf(norm(x))===i}).slice(0,5)}

  var cliente=norm(p.cliente+' '+p.palabras);
  var ex=[];exclusionesFicha().concat(base,deOferta).forEach(function(w){if(cliente.indexOf(norm(w))===-1&&ex.map(norm).indexOf(norm(w))===-1)ex.push(w)});
  var rg=rangoSeguidores();return {busquedas:bus.join('\n'),excluir:ex.slice(0,14).join(', '),min:canal==='instagram'&&usaSeguidores()?rg[0]:'',max:canal==='instagram'&&usaSeguidores()?rg[1]:''};

function filtrosDe(canal){

function validarBusqueda(canal){

  var B=lineas(f.busquedas),E=comas(f.excluir),LG=lugares().map(norm),lugar=LG.join(', ');

  var b2b=esB2B();
  if(b2b&&canal==='instagram')add('mejora','Tu cliente trabaja en empresas: en LinkedIn muestra su cargo y es más fácil de encontrar que en Instagram.','canal-linkedin',20);
  if(!b2b&&canal==='linkedin')add('mejora','Tu cliente suele mostrarse más en Instagram que en LinkedIn.','canal-instagram',10);
  if(B.length>5)add('mejora','Hay '+B.length+' búsquedas y solo se usan las primeras 5.','recortar',5);
  var dup=B.length-B.map(norm).filter(function(x,i,a){return a.indexOf(x)===i}).length;
  if(dup)add('mejora','Hay búsquedas repetidas: gastan sin traer gente nueva.','sin-duplicados',5);
  var comillas=B.filter(function(b){return /["“”]|\bOR\b/.test(b)});
  if(comillas.length)add('mejora','Las comillas y la palabra OR hacen la búsqueda tan exacta que suele traer 0 resultados.','sin-comillas',15);
  var largas=B.filter(function(b){return b.split(/\s+/).length>6});
  if(largas.length)add('mejora',largas.length+' búsqueda(s) con más de 6 palabras: mientras más larga, menos resultados.','acortar',10);
  var cortas=B.filter(function(b){return b.split(/\s+/).length<2});
  if(cortas.length)add('mejora',cortas.length+' búsqueda(s) de una sola palabra: traen cuentas grandes o famosas, no a tu cliente.','agregar-lugar',10);
  if(LG.length){var sinLugar=B.filter(function(b){return !LG.some(function(x){return norm(b).indexOf(x)>-1})});
    if(sinLugar.length)add('mejora',sinLugar.length+' búsqueda(s) sin país o ciudad: puede traer gente de otros países.','agregar-lugar',10)}
  else add('mejora','No indicaste país o ciudad en tu perfil. Agregarlo enfoca mucho la búsqueda.','',5);
  if(!E.length)add('mejora','Sin exclusiones aparecerán proveedores y competencia (quienes venden lo mismo que tú).','exclusiones',15);
  var choque=E.filter(function(e){return B.some(function(b){return norm(b).indexOf(norm(e))>-1})});
  if(choque.length)add('alerta','Excluyes "'+choque.join('", "')+'" pero también lo buscas: se anulan entre sí.','quitar-choques',20);
  if(canal==='instagram'){var mx=Number(f.max)||0;if(mx>10000)add('mejora','Más de 10.000 seguidores suele ser alguien con negocio ya armado.','seguidores',5)}
  var R=registro().filter(function(r){return r.canal===canal}),ag=0,no=0,mot={};
  R.forEach(function(r){ag+=r.agregados;for(var k in r.noCalza){no+=r.noCalza[k];mot[k]=(mot[k]||0)+r.noCalza[k]}});
  if(ag+no>=5&&no/(ag+no)>0.5){var top=Object.keys(mot).sort(function(a,b){return mot[b]-mot[a]})[0];
    add('alerta','En tus búsquedas anteriores en '+CANALES[canal]+' no calzaron '+Math.round(no/(ag+no)*100)+'%. El motivo más común: '+(MOTIVOS.filter(function(m){return m[0]===top})[0]||['',''])[1].toLowerCase()+'.',top==='proveedor'||top==='organizacion'?'exclusiones':'',15)}
  if(BUS.cantidad>=20)add('bien','Pediste 20: cuesta más y tarda más. Con 10 ya puedes medir si la búsqueda sirve.','',0);
  pts=Math.max(0,Math.min(100,pts));
  if(!items.filter(function(i){return i.tipo!=='bien'}).length)items.unshift({tipo:'bien',texto:'Tu búsqueda está bien armada.',fix:''});
  return {pts:pts,items:items};
}
function aplicarMejora(canal,fix){
  var f=filtrosDe(canal),p=S.meta.perfil,B=lineas(f.busquedas),E=comas(f.excluir),LL=lugares(),lugar=LL[0]||'';
  if(fix==='proponer'){S.meta.filtros[canal]=proponerFiltros(canal);return canal}
  if(fix==='canal-linkedin'){filtrosDe('linkedin');return 'linkedin'}
  if(fix==='canal-instagram'){filtrosDe('instagram');return 'instagram'}
  if(fix==='recortar')B=B.slice(0,5);
  if(fix==='sin-duplicados')B=B.filter(function(x,i){return B.map(norm).indexOf(norm(x))===i});
  if(fix==='sin-comillas')B=B.map(function(b){return b.replace(/["“”]/g,'').replace(/\s+OR\s+/g,' ').replace(/\s+/g,' ').trim()});
  if(fix==='acortar')B=B.map(function(b){var w=b.split(/\s+/);if(w.length<=6)return b;var l=lugar&&norm(b).indexOf(norm(lugar))>-1?' '+lugar:'';return w.filter(function(x){return norm(x)!==norm(lugar)}).slice(0,4).join(' ')+l});
  if(fix==='agregar-lugar'&&LL.length)B=B.map(function(b,i){return LL.some(function(x){return norm(b).indexOf(norm(x))>-1})?b:b+' '+LL[i%LL.length]});
  if(fix==='exclusiones'){comas(proponerFiltros(canal).excluir).forEach(function(w){if(E.map(norm).indexOf(norm(w))===-1)E.push(w)})}
  if(fix==='quitar-choques')E=E.filter(function(e){return !B.some(function(b){return norm(b).indexOf(norm(e))>-1})});
  if(fix==='seguidores')f.max=5000;
  f.busquedas=B.join('\n');f.excluir=E.join(', ');return canal;
}

var SENALES_BASE={necesidad:['Habla del problema que tú resuelves','Pregunta o pide ayuda sobre el tema','Se nota que lo está intentando sola','Su situación calza con a quién ayudas'],
  afinidad:['Usa palabras parecidas a las tuyas','Comparte un estilo o valores cercanos','Está en tu país o habla tu idioma','Tienen conocidos o intereses en común'],
  capacidad:['Ya invierte en formarse o en su negocio','Tiene trabajo o negocio activo','Ya paga por servicios parecidos','Puede decidir la compra por sí misma']};
function planBasico(){
  var p=S.meta.perfil,t=(p.cliente+' '+p.palabras+' '+p.oferta).toLowerCase();
  var empresa=/jef|gerent|empresa|l[ií]der|ejecutiv|equipo|rrhh|recursos humanos|corporativ|director/.test(t);
  var visible=/coach|terapeut|psic[oó]log|nutri|emprended|mentor|consultor|instructor|profesor|due[ñn]|marca personal|freelanc|dise[ñn]ador|fot[oó]graf/.test(t);
  var tipo=(empresa||visible)?'personas':'lugares',canales=[];
  if(!p.baseLista)canales.push({canal:'whatsapp',porque:'Tus conocidos son la fuente más rápida para empezar: ya confían en ti.'});
  if(empresa)canales.push({canal:'linkedin',porque:'Tu cliente trabaja en empresas y ahí muestra su cargo.'});
  if(visible||!empresa)canales.push({canal:'instagram',porque:tipo==='personas'?'Tu cliente muestra su trabajo en su propio perfil.':'Ahí están las cuentas que tu cliente ya sigue.'});
  if(tipo==='lugares')canales.push({canal:'facebook',porque:'En los grupos tu cliente pregunta y pide ayuda.'});
  var pal=palabrasCliente().slice(0,3);
  if(!pal.length)pal=[p.cliente.split(/[,.]/)[0].trim()];
  var bus=[];
  canales.forEach(function(c){
    if(c.canal==='whatsapp'){bus.push({canal:'whatsapp',texto:'Revisa tus contactos y anota a quienes calzan o conocen a alguien que calce',busca:'personas',para:'Personas que ya te conocen'});return}
    pal.forEach(function(w,i){var L=lugares();bus.push({canal:c.canal,texto:(w+' '+(L.length?L[i%L.length]:'')).trim(),busca:tipo,para:tipo==='personas'?'Perfiles que se presentan así':'Grupos y cuentas donde se reúnen'})});
  });
  return {resumen:tipo==='personas'?'Tu cliente se muestra en público: buscamos personas.':'Tu cliente no se muestra en público: buscamos los lugares donde ya se reúne.',
    tipo:tipo,canales:canales,busquedas:bus,senales:clon(SENALES_BASE),creado:hoy(),conIA:false};
}
function limpiaPlan(r){
  var b=planBasico();if(!r||typeof r!=='object')return b;
  function ok(c){return CANALES[c]&&c!=='otro'?c:'google'}
  function txt(a,max){return Array.isArray(a)?a.map(function(x){return String(x).slice(0,160)}).filter(Boolean).slice(0,max):[]}
  var can=Array.isArray(r.canales)?r.canales.slice(0,4).map(function(c){return {canal:ok(String(c.canal||'').toLowerCase()),porque:String(c.porque||'').slice(0,220)}}):[];
  var bus=Array.isArray(r.busquedas)?r.busquedas.slice(0,10).map(function(x){return {canal:ok(String(x.canal||'').toLowerCase()),texto:String(x.texto||'').slice(0,160),busca:x.busca==='lugares'?'lugares':'personas',para:String(x.para||'').slice(0,160)}}).filter(function(x){return x.texto}):[];
  var s=r.senales||{};
  var sen={necesidad:txt(s.necesidad,5),afinidad:txt(s.afinidad,5),capacidad:txt(s.capacidad,5)};
  return {resumen:String(r.resumen||b.resumen).slice(0,260),tipo:r.tipo==='lugares'?'lugares':'personas',
    canales:can.length?can:b.canales,busquedas:bus.length?bus:b.busquedas,
    senales:{necesidad:sen.necesidad.length?sen.necesidad:b.senales.necesidad,afinidad:sen.afinidad.length?sen.afinidad:b.senales.afinidad,capacidad:sen.capacidad.length?sen.capacidad:b.senales.capacidad},
    creado:hoy(),conIA:true};
}
function enlaces(b){
  var q=encodeURIComponent(b.texto),g='https://www.google.com/search?q=';
  if(b.canal==='instagram')return [['Buscar en Google',g+encodeURIComponent('site:instagram.com '+b.texto)],['Buscar en Instagram','https://www.instagram.com/explore/search/keyword/?q='+q]];
  if(b.canal==='linkedin')return [['Buscar en LinkedIn','https://www.linkedin.com/search/results/'+(b.busca==='lugares'?'groups':'people')+'/?keywords='+q],['Buscar en Google',g+encodeURIComponent('site:linkedin.com/in '+b.texto)]];
  if(b.canal==='facebook')return [['Buscar grupos','https://www.facebook.com/search/groups/?q='+q],['Buscar páginas','https://www.facebook.com/search/pages/?q='+q]];
  if(b.canal==='whatsapp')return [];
  return [['Buscar en Google',g+q]];
}

  else if(a==='guardar'){var d=hoja.d;if(!d.nombre.trim()){toast('Ponle un nombre para reconocerla.');return}
    var np=normal({id:nuevoId(),nombre:d.nombre.trim(),canal:d.canal,link:d.link.trim(),notas:d.notas.trim(),telefono:String(d.telefono||'').trim(),grupo:d.grupo||'nueva',estado:'listo'});anota(np,'Agregada');
    S.pros[np.id]=np;Store.pro(np);hoja={tipo:'pro',id:np.id};pintaHoja();render();$('#hoja').scrollTop=0;
    if(v==='ia')calificarIA(np);else toast('Guardada en '+nombreEtapa('listo')+'.')}
  else if(!p){return}
  else if(a==='pgrupo'){p.grupo=v;anota(p,'Grupo: '+nombreGrupo(v));if(v==='fuera'&&['listo','nuevo','contactada'].indexOf(p.estado)>-1){p.estado='descartada';p.proximoSeg=''}Store.pro(p);pintaHoja()}
  else if(a==='punto'){if(!p.calificado){p.n=p.n||0;p.a=p.a||0;p.c=p.c||0}p[b.dataset.d]=Number(v);p.calificado=true;Store.pro(p);pintaHoja()}
  else if(a==='ia-cal'){calificarIA(p)}
  else if(a==='ia-msj'){mensajeIA(p)}
  else if(a==='copiar'){var t=$('#fp-mensaje'),txt=t.value;
    var falla=function(){t.focus();t.select();toast('Selecciónalo y cópialo a mano.')};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast('Mensaje copiado. Pégalo en '+CANALES[p.canal]+'.')},falla);else falla()}
  else if(a==='etapa'){mover(p,v);pintaHoja();toast(v==='enviada'?'Anotado. Te aviso en '+seg().primero+' días si no responde.':v==='cliente'||(v==='avanzar'&&p.estado==='cliente')?'¡Nueva clienta! 🎉':p.estado==='descanso'?'Queda descansando. Te aviso el '+p.proximoSeg+'.':'Anotado.')}
  else if(a==='borrar'){if(!borrarListo){borrarListo=true;pintaHoja();return}borrarListo=false;Store.borrar(p.id);hoja=null;pintaHoja();render();toast('Prospecto borrado.')}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&(ev.target.id==='ac-pass'||ev.target.id==='ac-mail')){ev.preventDefault();enviarAcceso()}});
document.addEventListener('toggle',function(ev){if(ev.target&&ev.target.id==='det-fil')BUS.verFiltros=ev.target.open},true);
document.addEventListener('change',function(ev){
  if(ev.target.id!=='importar'||!ev.target.files[0])return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);if(!d||!Array.isArray(d.prospectos))throw 0;
      if(d.meta&&!S.meta.perfil.cliente.trim()){ponMeta(d.meta);Store.meta()}
      var n=0;d.prospectos.forEach(function(p){if(!p||!p.id||S.pros[p.id])return;S.pros[p.id]=normal(p);Store.pro(S.pros[p.id]);n++});
      toast(n+' prospectos importados.');render();
    }catch(e){toast('Ese archivo no es un respaldo de esta app.')}
  };
  fr.readAsText(ev.target.files[0]);
});
document.addEventListener('input',function(ev){
  var t=ev.target,ds=t.dataset;
  if(ds.gratis){BUS.gratis=t.value;var ga=$('#gratis-ir'),gu=urlGratis();if(ga){ga.href=gu||'#';ga.style.opacity=gu?'':'.55';ga.style.pointerEvents=gu?'':'none'}return}
  if(ds.fil){var ff=filtrosDe(canalActual());ff[ds.fil]=t.value;Store.meta();BUS.paso='';return}
  if(ds.bus){BUS[ds.bus]=ds.bus==='cantidad'?Number(t.value):t.value;BUS.paso='';render();return}
  if(ds.q){S.q=t.value;var lp=$('#lista-pros');if(lp)lp.innerHTML=listaPros();return}
  if(ds.imp&&hoja&&hoja.d){hoja.d[ds.imp]=t.value;var imn=$('#im-n');if(imn)imn.textContent=parsearLista(hoja.d.texto).length+' persona(s) detectada(s).';return}
  if(ds.ne){if(!S.meta.nombresEtapa)S.meta.nombresEtapa={};S.meta.nombresEtapa[ds.ne]=t.value;Store.meta();return}
  if(ds.em){var M=editMedio(),it=M[Number(ds.i)];if(!it)return;it[ds.em]=ds.em==='fecha'?t.checked:ds.em==='dias'?Math.max(0,Math.round(Number(t.value)||0)):t.value;Store.meta();return}
  if(ds.seg){var nv=Math.round(Number(t.value));if(nv>=1){if(!S.meta.seg)S.meta.seg={};S.meta.seg[ds.seg]=nv;Store.meta()}return}
  if(ds.msj){if(!S.meta.mensajes)S.meta.mensajes={};S.meta.mensajes[ds.msj]=t.value;Store.meta();return}
  if(ds.f){S.meta.perfil[ds.f]=t.type==='checkbox'?t.checked:t.value;Store.meta()}
  else if(ds.meta){var n=Math.round(Number(t.value));if(n>=1&&n<=30){S.meta.metaDiaria=n;Store.meta()}}
  else if(ds.nf&&hoja&&hoja.d){hoja.d[ds.nf]=t.value}
  else if(ds.pf&&hoja&&hoja.id&&S.pros[hoja.id]){var p=S.pros[hoja.id];
    if(ds.pf==='estado'){var ne2=t.value;if(etapaMedio(ne2))aEtapa(p,ne2);else{p.estado=ne2;anota(p,'Pasó a: '+nombreEtapa(ne2));p.proximoSeg=ne2==='descanso'?enDias(seg().descanso):''}
      if(ne2==='contactada'){p.contactadaEn=p.contactadaEn||hoy();p.proximoSeg=enDias(seg().primero)}
      if((t.value==='conversacion'||t.value==='propuesta'||t.value==='cliente')&&!p.respondioEn)p.respondioEn=hoy();
      Store.pro(p);pintaHoja()}
    else{p[ds.pf]=t.value;if(ds.pf==='citaEn'&&t.value){p.proximoSeg=diaAntes(t.value);var px=$('#fp-prox');if(px)px.value=p.proximoSeg}
      if(ds.pf==='mensaje'||ds.pf==='mensajeSeg'||ds.pf==='telefono'){var w=$('#fp-wa'),u=waLink(p,($('#fp-mensaje')||{}).value);if(w&&u)w.href=u;else if(!w&&u&&ds.pf==='telefono'){setTimeout(function(){if(document.activeElement.id!=='fp-tel')pintaHoja()},0)}}
      Store.pro(p)}}
});
document.addEventListener('focusout',function(){if(pendiente)setTimeout(refrescar,80)});

arrancar();
})();
</script>
</body>
</html>
